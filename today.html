<script>

/* What Dana's three tools return today (fictional). Red marks words that differ from PD-A, the wording Legal approved for 2026. */
const TOOLS = [
  { kind: "viewer", tool: "Script library", badge: "PDF", path: "Scripts / Pharmacy / Rx_Education_Script_v2.pdf", where: "Page 3 of 9 · section 4, Pricing disclaimer", editor: "Pharmacy Education", upd: "8 Dec 2025", results: 14,
    before: "I will share an estimate for each drug you take.", text: PD_WORDINGS[0].text, after: "5. Mail-order option" },
  { kind: "files", tool: "Shared drive", badge: "DOCX", path: "Pharmacy / Scripts / 2027 / Rx_Education_Script_v3_DRAFT.docx", editor: "Pharmacy Education", upd: "30 Oct 2026", results: 9,
    siblings: ["Rx_Education_Script_v3_DRAFT.docx", "Rx_Education_Script_v2_FINAL.docx", "Pharmacy_Desk_Reminders_FINAL_v1 (2).docx", "pricing_disclaimer_OLD.docx"], text: PD_WORDINGS[1].text },
  { kind: "article", tool: "Intranet", badge: "WEB", path: "Knowledge home / Member communications / KB-4471", article: "Member Benefits Quick Guide 2027 · updated 27 Oct 2026", editor: "Member Communications", upd: "27 Oct 2026", results: 6, text: PD_WORDINGS[2].text }
];
const canon = new Set(PD_WORDINGS[0].text.toLowerCase().replace(/[^a-z0-9' ]/g, "").split(" "));
const mark = t => t.split(" ").map(w => canon.has(w.toLowerCase().replace(/[^a-z0-9']/g, "")) ? esc(w) : `<span class="mark">${esc(w)}</span>`).join(" ");
function tool(h) {
  const search = `<div class="tsearch"><span class="small">Search</span><b>rx pricing disclaimer</b><span class="small">${h.results} results</span></div>`;
  let body = "";
  if (h.kind === "viewer") body = `<div class="tpath">${esc(h.path)}</div><div class="small">${esc(h.where)}</div><div class="paper"><p class="ctx">${esc(h.before)}</p><p class="vline"><span class="vt">Verbatim (Legal)</span> ${mark(h.text)}</p><p class="ctx">${esc(h.after)}</p></div>`;
  if (h.kind === "files") body = `<div class="tpath">${esc(h.path.split(" / ").slice(0, -1).join(" / "))} /</div><ul class="flist">${h.siblings.map((f, i) => `<li class="${i === 0 ? "on" : ""}"><span class="fi">W</span>${esc(f)}</li>`).join("")}</ul><div class="paper"><p class="vline">${mark(h.text)}</p></div>`;
  if (h.kind === "article") body = `<div class="tpath">${esc(h.path)}</div><div class="small">${esc(h.article)}</div><div class="paper"><p class="ctx">Pricing disclaimer</p><p class="vline">${mark(h.text)}</p></div>`;
  return `<div class="tool"><div class="th"><span><span class="tbadge">${h.badge}</span><b>${esc(h.tool)}</b></span></div><div class="small">Edited ${h.upd} by ${esc(h.editor)}</div>${search}${body}<div class="q">Approved by Legal? Not shown. Current? Not shown. Which channels use it? Not shown.</div></div>`;
}
const STRIP = [["Source written", "1", "script; the locked line sits on page 3", "1", "script split into topics"], ["Copied", "3", "wordings in 3 tools, no owner per copy", "1", "unit; duplicates proposed, not merged"],
  ["Channels", "6", "teams each write their own answer", "1", "unit feeds every channel"], ["Legal revises", "1 of 3", "copies get fixed", "All", "places listed in one alert"], ["Search", "0", "empty searches logged", "Every", "empty search goes to Priya"]];
document.getElementById("view").innerHTML = `<h1>Today: one question, three answers</h1>
  <div class="intro"><div><b>On this screen:</b> Dana must read the pricing disclaimer word for word. She searches her three tools and gets three wordings.</div><div><b>Notice:</b> the red words differ from the wording Legal approved, and no tool says which one is current.</div></div>
  <div class="tv-q"><div class="av">JH</div><div><span class="small" style="color:rgba(255,255,255,.7)">Member on the line</span><br><b>"You told me my statin is $12. Is that the final price?"</b></div><div class="hold"><span id="hold">00:00</span><small>member on hold</small></div></div>
  <div class="cols">${TOOLS.map(tool).join("")}</div>
  <p class="small" style="margin-top:8px">Red marks the words that differ from PD-A, the wording Legal approved for 2026. The three tools return ${TOOLS.reduce((a, h) => a + h.results, 0)} results between them, and none says which wording is approved.</p>
  <div class="counters"><div class="counter"><div class="n">3</div><div class="l">wordings of one locked clause</div></div><div class="counter"><div class="n">0</div><div class="l">say which one Legal approved</div></div><div class="counter"><div class="n">0</div><div class="l">empty searches logged anywhere</div></div><div class="counter g"><div class="n">1</div><div class="l">approved unit, after the platform</div></div></div>
  <h2>Where it breaks, and what changes</h2>
  <div class="strip" style="margin-top:8px">${STRIP.map(x => `<div class="st"><h4>${x[0]}</h4><div class="r"><b>${x[1]}</b>${esc(x[2])}</div><div class="gr"><b>${x[3]}</b>${esc(x[4])}</div></div>`).join("")}</div>
  <p class="small" style="margin-top:10px">Public context: in 2006, GAO test calls to Part D call centres got accurate and complete answers to 34% of calls, 294 of 864 [R-25]. Lakewell's own rate is unknown (assumed). All documents and counts on this page are fictional and illustrative.</p>`;
let t = 0; const hEl = document.getElementById("hold"); setInterval(() => { t = Math.min(t + 3, 108); hEl.textContent = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); }, 80);
</script></body></html>
