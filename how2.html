<script>
nav("how2.html", "legal", { demo: true });
const KU301 = slaStage(((units(S()).find(u => u.id === "KU-301") || {}).seed || {}).submitted || "28 Oct 2026", "legal"); /* the scene clock reads the same seed as the product (audit A-030) */
const TIP = (MESSY_UNITS.find(u => u.id === "KU-224") || { versions: [{ text: "" }] }).versions[0].text;
const chk = (items, done) => `<div class="docv">${items.map(([who, t, d], i) => `<p><span style="display:inline-block;width:18px">${i < done ? "☑" : "☐"}</span><b>${esc(t)}</b> <span class="small">${esc(who)} · ${esc(d)}</span></p>`).join("")}</div>`;
const PDB = PD_WORDINGS[1].text, ES = ((CORE_UNITS.find(u => u.id === "KU-202") || {}).translations || {}).es || {};
const OONF = OON_FORMAT_EDIT, OON = (DOCS.find(d => d.id === "DOC-RXV2").sections.flatMap(s => s.blocks).find(b => b.verbatim && /network/.test(b.t || "")) || {}).t;
window.ACT = {
  title: "Job 2 · Govern and approve", role: "legal",
  take: {
    today: { title: "Approvals nobody can trust", lead: "Content reaches June without a real check, a clear owner, or anyone noticing delays.", items: [
      ["pencil", "Approving your own work", "The bot's script was signed off by its author."], ["shield", "Clinical advice, unchecked", "The chat gives a health tip no pharmacist reviewed."],
      ["copies", "Two teams, two wordings", "Nobody has the authority to pick one."], ["send", "No real sign-off", "A text goes out on an email 'looks fine'."], ["clock", "Reviews that stall", "The website keeps old wording while a review sits unread."]] },
    new: { title: "Approve once, with confidence", lead: "Every answer is checked by the right person, on time, and on record.", items: [
      ["lock", "Separation of duties", "The author can never approve her own work."], ["shield", "Clinical eyes on clinical advice", "Pharmacist, then medical director."],
      ["source", "One owner per decision", "Tom decides which wording holds."], ["stamp", "Approval is a gate", "AI checks; a person confirms; nothing else goes live."], ["calendar", "Clocks on every review", "Escalate, reassign, never stuck."]] }
  },
  channels: {
    Voice: { who: "The phone bot's script was edited and then approved by the same person, two minutes apart.",
      today: () => `${screen("Change log · phone bot script", ["<b>Edited by:</b> Priya Nandakumar · 3:02 PM", "<b>Approved by:</b> Priya Nandakumar · 3:04 PM"], "Same person, two minutes apart. Nothing stopped it.")}${compare("Written by one person, approved by another.", "Written and approved by the same person.", "What the log shows", "No second pair of eyes", "What should happen")}`,
      issue: ["The person who wrote the bot's script also approved it, so nobody else ever checked it", "June hears whatever slipped past the author, read out by the bot to every caller", "It breaks a basic compliance control: separation of duties"],
      path: [["WRITTEN", "By Priya", "3:02 PM"], ["SELF-APPROVED", "By Priya", "3:04 PM"], ["NO CHECK", "The tool allows it", "no second person"], ["BOT READS IT", "To every caller", "unreviewed"]],
      now: () => `${screen("Approve · Pricing walk-through", ["<b>Priya Nandakumar</b> tried to approve her own change", '<span class="bad2">Refused: the author cannot approve her own work</span>', "Logged: Priya Nandakumar · 3:04 PM · " + unitName("KU-202") + ", v2", "Sent to: <b>Tom Bexley</b>, Medicare Compliance reviewer (it holds exact wording)"])}`,
      fix: ["The system itself refuses an approval from the author, and logs the attempt", "Everything the bot reads to June was checked by someone other than the person who wrote it", "Separation of duties holds even if a screen or a tool gets it wrong"],
      fixpath: [["WRITTEN", "By Priya", "submitted"], ["CHECKED", "Who is approving?", "the author? refused"], ["LOGGED", "The attempt", "for audit"], ["APPROVED", "By another person", "the right type"]],
      fix4: { line: "Priya edited the script, so the system won't let her approve it.", steps: [1], tech: ["Separation of duties", "Audit trail"], kind: "Rule", control: "The approval record itself rejects a signature from the topic's author, or a second signature from the same person, and logs the attempt.", who: "The approver for that content type; never the author", proof: "Author and same-person signatures refused at the data layer (D30, D74); every attempt logged (test T3)." } },
    "Member chat": { who: "The member chat can read the pharmacy desk's shared notes, including a statin tip.",
      today: () => `${screen("Member chat", ["<b>June:</b> Should I take my statin in the morning or at night?", "<b>Chat:</b> " + esc(TIP)], "From a desk note nobody clinical ever reviewed.")}${compare("Reviewed by a clinical pharmacist, then signed off by the medical director.", "Never reviewed by anyone clinical.", "Who checked this tip", "Nobody qualified", "What should happen")}`,
      issue: ["The chat repeats a health tip written on the desk, never reviewed by a pharmacist or doctor", "June gets health advice that nobody qualified ever checked", "Clinical advice without clinical review is a patient-safety and liability risk"],
      path: [["WRITTEN", "On the desk", "by a non-clinician"], ["SAVED", "Shared notes", "no owner"], ["NO REVIEW", "No pharmacist, no doctor", "nobody checks"], ["CHAT SAYS IT", "To June", "as advice"]],
      now: () => `${chk([["AI", "Routed by type: clinical guidance", "to Grace"], ["Grace Mbeki", "Pharmacist review", "signed 1 Nov"], ["Dr. Ruth Calloway", "Medical director, second sign-off", "signed 2 Nov"], ["Ruth Calloway", "Starts 1 Jan 2027", "scheduled"]], 4)}`,
      fix: ["Clinical content goes to a clinical pharmacist, then the medical director signs off second, and it goes live on the medical director's publish date (1 Jan 2027 here)", "June only hears health advice two qualified people checked", "Extra sign-off only where it matters, so nothing else slows down"],
      fixpath: [["FOUND", "A clinical tip", "at ingest"], ["ROUTED", "To Grace", "by content type"], ["TWO SIGNERS", "Grace, then Ruth", "clinical only"], ["SCHEDULED", "Live on their date", "not before"]],
      fix4: { line: "The statin tip goes live only after a pharmacist and the medical director sign.", steps: [0, 1], tech: ["Content-type routing", "Two-person sign-off"], kind: "AI routes, two people approve", control: "Extraction classifies the content type; clinical guidance always goes to a clinical approver and needs a second signature from the medical director; a scheduled date is honoured.", who: "Grace signs first; Ruth signs second", proof: "Clinical routing check; a dated co-sign stays scheduled until its date (D53, D62)." } },
    "Advocate desk": { who: "Dana finds two 'official' disclaimers: Legal's and Member Communications'.",
      today: () => `${compare(PD["PD-A"], PD["PD-C"], "Member Communications' version", "In the Quick Guide; never approved by Legal")}${screen("Who decides?", ["Both teams think theirs is right. Nobody owns the decision, so both stay live."])}`,
      issue: ["Two teams publish two wordings of the same legal line, and nobody has the authority to pick one", "Dana reads June whichever one she finds first", "Both stay live indefinitely, and the plan can't say which is official"],
      path: [["TWO VERSIONS", "Legal's and Member Comms'", "both published"], ["NO OWNER", "Nobody's decision", "both stay live"], ["NO RESOLUTION", "Months of email", "or nothing"], ["DANA", "Picks one", "while June waits"]],
      now: () => `${screen("Conflict of authority · Pricing disclaimer", ["<b>Legal (PD-A):</b> " + esc(PD["PD-A"]), "<b>Member Communications (PD-C):</b> " + esc(PD["PD-C"]), '<span class="ok2"><b>Tom Bexley decided:</b> Legal\'s wording holds. PD-C retired; the Quick Guide now points to the approved topic.</span>'])}`,
      fix: ["The conflict goes to the one person with authority: Tom decides once which wording holds, and the other copy retires", "Dana sees one approved wording, so June hears the same legal words everywhere", "One decision, on record, ends the argument for good"],
      fixpath: [["FOUND", "Two wordings of one clause", "by dedup"], ["RAISED", "As a conflict of authority", "to Tom"], ["DECIDED", "Legal's wording holds", "on record"], ["RETIRED", "The other copy", "points to it"]],
      fix4: { line: "Tom rules once: Legal's wording stays, the Quick Guide copy is retired.", steps: [1], tech: ["Conflict-of-authority workflow", "Knowledge graph"], kind: "A person decides", control: "The AI never resolves a conflict of authority; it raises it with both wordings side by side. Tom's decision retires the other copy and redirects it to the approved topic.", who: "Tom (Legal) holds authority over legal wording", proof: "Only one approved wording is ever served (golden questions 1 and 2); the retired copy never returns." } },
    Outbound: { who: "The reminder team gets a quick 'looks fine' by email and sends.",
      today: () => `${screen("Email thread · 'refill reminder text, ok?'", ["<b>Reminder team:</b> New refill text attached, ok to send today?", "<b>Tom:</b> Looks fine at a glance, go ahead."], "Sent to 48,210 members that afternoon. No checklist, no record of what Tom checked (illustrative).")}${compare("Approved: checked against the source, dated, with Tom's name and the version on record.", "'Looks fine at a glance' in an email.", "What counts as approval", "Nothing records what was checked", "What a real approval looks like")}`,
      issue: ["Approval is an email reply: no checklist, no record of what was checked, no start date", "June gets a text with wording nobody properly checked", "When an auditor asks who approved it and what they checked, there's no answer"],
      path: [["DRAFT", "Reminder text", "by the team"], ["EMAIL", "'Ok to send?'", "to Tom"], ["NO GATE", "'Looks fine'", "nothing recorded"], ["SENT", "To 48,210 members", "illustrative · no trail"]],
      now: () => `${chk([["Rule", "Text matches the approved source", "similarity 1.00"], ["Rule", "Exact wording character-exact", "fingerprint matches"], ["Rule", "Dates, audience and channels set", "texts: link only"], ["Tom Bexley", "The answer is correct and complete", "only a person ticks this"]], 4)}<p class="small ok2"><b>Refill reminder text approved by Tom Bexley, 2 Nov 2026, version 2, in force from 1 Jan 2027.</b> Only now can a campaign use it. The pricing disclaimer it quotes is approved separately, in Keep it current.</p>`,
      fix: ["Approval is a gate: fixed rules run the checks, Tom confirms the answer is correct, and nothing can be sent until he does", "June only gets texts with wording Tom actually checked", "Every approval is on record with who, what, which version and when"],
      fixpath: [["DRAFT", "Reminder line", "from an approved topic"], ["AI CHECKS", "Source, exact wording, dates", "shown to Tom"], ["TOM CONFIRMS", "Correct and complete", "the one human tick"], ["RECORDED", "Approved with a date", "then it can be sent"]],
      fix4: { line: "The reminder text can't go out until the rules check it and Tom signs.", steps: [1], tech: ["Approval workflow", "Rule checks"], kind: "Rules check, a person approves", control: "Only approved content can be read by any channel, reminders included; Approve stays locked until every check is ticked; each approval is an append-only event with actor, time and version.", who: "Tom approves legal wording; Grace pharmacy content; Renee operational content", proof: "Nothing unapproved is ever served (golden question 11); every state change carries actor, time and version (test T3)." } },
    Website: { who: "An update to the website's appeal-deadline wording has been waiting in Tom's inbox. Tom is on holiday.",
      today: () => `${screen("Tom's inbox", [`<b>Appeal deadline wording</b> · received ${KU301.a} working days ago · unread`], "No deadline, no reminder, no backup. The website keeps the old wording meanwhile.")}${compare("Reviewed within 3 working days, or moved to a backup.", `Unread for ${KU301.a} working days, and counting.`, "What happens", "Nobody knows when it is late", "What should happen")}`,
      issue: ["Reviews have no deadline: an update sits unread for days while the approver is away, and nobody notices", "June reads the old wording on the website long after it should have changed", "Fixes pile up, and nobody can say how long anything takes to approve"],
      path: [["SUBMITTED", "To Tom", `${KU301.a} working days ago`], ["UNREAD", "Tom is away", "no backup"], ["NO CLOCK", "No reminder", "no escalation"], ["WEBSITE", "Keeps old wording", "nobody knows"]],
      now: () => `${screen("Renee's queue · review clocks", [`<b>Appeal deadline wording</b> · Tom Bexley · ${KU301.late > 0 ? `<span class='bad2'>${KU301.late} working day${KU301.late === 1 ? "" : "s"} late</span>` : KU301.late === 0 ? "<span class='bad2'>due today · reminder sent · Tom is away</span>" : `due in ${-KU301.late} working days`}`, "→ If it passes its date: moved to the backup compliance reviewer, who is notified; clock restarted", "<b>Insulin supply limit</b> · Grace Mbeki · due today · reminder sent"])}`,
      fix: ["Every review has a clock in working days: a reminder, then escalation, then a backup, then the owner decides", "June reads the updated wording on time, even when someone is away", "The plan can see how long approvals take, and nothing waits forever"],
      fixpath: [["SUBMITTED", "To Tom", "clock starts"], ["DUE", "Reminder", "day 3"], ["LATE", "Escalate, then backup", "day 4, then day 6"], ["DECIDED", "By the backup or Renee", "never stuck"]],
      fix4: { line: "Tom is on holiday, so his overdue review moves to a backup.", steps: [1], tech: ["Service-level clocks", "Escalation ladder"], kind: "Rule", control: "Each review counts working days (weekends and US federal holidays skipped): due means a reminder, 1 day late escalates, 3 days late reassigns to a backup of the same type, and a late backup goes to Renee.", who: "Renee owns the queue; backups are the same type as the original approver", proof: "Clock and ladder rules (D58, D67, D68); 3 working days per signer, 6 end to end for two signers." } },
    Drift: { who: "Legal edits the pricing disclaimer for 2027. The phone bot's team never hears about it.",
      today: () => `${compare(PD_B_FINAL, PD["PD-A"], "What the bot still reads", "The 2026 wording, months after Legal changed it", "What Legal approved for 2027")}${screen("Who was told?", ["Legal emailed the script owner. Nobody knew the bot, the chat, the website and two desk files held copies."])}`,
      issue: ["Legal changes one sentence, but nobody knows every place it lives, so the bot keeps the old wording", "From 1 Jan, June hears last year's terms from the bot, without the new 'payment plan election' line", "The plan is out of compliance in one channel, and nobody can see it"],
      path: [["LEGAL EDIT", "2027 disclaimer", "in Script v3"], ["EMAIL", "To the script owner", "only"], ["NO MAP", "Nobody knows the copies", "bot, chat, web, desk"], ["BOT", "Keeps 2026 wording", "into 2027"]],
      now: () => `${screen("Drift alert · Pricing disclaimer", ["<b>Legal changed the exact wording in Rx Education Script v3</b>", "<b>Lives in:</b> phone bot · member chat · Agent Assist and search · texts · website · 2 desk files", '<b>Proposed:</b> version 2, in force from 1 Jan 2027', '<span class="ok2"><b>Tom Bexley approved once</b>, 2 Nov 2026. Every channel switches on 1 Jan 2027.</span>'])}<div class="match"><b>What Legal approved for 2027 = what the bot reads from 1 Jan</b><p style="margin:4px 0 6px">${esc(PD_B_FINAL)}</p><span class="small">Switched with every other channel, on the same day.</span></div>`,
      fix: ["When the source changes, one alert lists every channel and file the clause lives in, with the proposed new version", "From 1 Jan the bot reads June the 2027 wording, the same as every other channel", "One approval updates everything; nobody has to remember the copies"],
      fixpath: [["LEGAL EDIT", "2027 disclaimer", "in Script v3"], ["DETECTED", "Meaning changed", "one grouped alert"], ["APPROVED", "Once, by Tom", "starts 1 Jan 2027"], ["SWITCHED", "Every channel", "on the same day"]],
      fix4: { line: "Legal edits the disclaimer once; one alert updates every place it lives.", steps: [1, 2], tech: ["Drift detection", "Knowledge graph", "Temporal versioning"], kind: "Rule detects, AI proposes, a person approves", control: "Drift detection diffs every tracked span when a source changes and raises one grouped alert, using the graph to list every place the clause lives; the approved version carries its start date.", who: "Tom approves the edit once", proof: "Drift caught; the v3 draft is never served before approval (golden questions 10 and 11); every channel switches together." } },
    Format: { who: "Someone fixes extra spaces in the out-of-network line. The chat team gets 40 alerts.",

      issue: ["Every edit raises an alert, even fixing extra spaces, so the team gets dozens and stops reading them", "The real legal change to the disclaimer is ignored, and the chat keeps telling June the old wording", "Alert fatigue hides the one change that matters"],
      path: [["EDIT", "Extra spaces fixed", "no change in meaning"], ["ALERTS", "40 of them", "to the chat team"], ["IGNORED", "Inbox nobody reads", "alert fatigue"], ["MISSED", "The real change", "buried"]],
      now: () => `${screen("Drift check · Out-of-network wording", ["<b>Change found:</b> spacing only", '<span class="ok2"><b>No alert:</b> the meaning is the same</span>', "<b>Separately:</b> pricing disclaimer, meaning changed → one grouped alert to Tom"])}`,
      fix: ["Formatting-only edits raise no alert; a change in the words raises one grouped alert to the right approver", "The chat gets the real change in time, and June hears the current wording", "Few, meaningful alerts, so people read every one"],
      fixpath: [["EDIT", "Extra spaces fixed", "in a source"], ["COMPARED", "Meaning, not formatting", "the same"], ["NO ALERT", "Nothing to do", "nobody bothered"], ["REAL CHANGE", "One alert", "to the right approver"]],
      fix4: { line: "Fixing extra spaces raises no alert; only a change in words does.", steps: [1], tech: ["Drift detection", "Normalised text diff"], kind: "Rule", control: "The diff ignores formatting and compares the normalised words on tracked spans only; one grouped alert per source change goes to the approver for that content.", who: "The approver for that content type", proof: "A formatting-only edit raises no alert (test T2); drift precision is measured." } },
    Translation: { who: "The English pricing page is updated for 2027. The Spanish page is a machine translation of the old wording.",
      today: () => `${screen("Website · Precios de medicamentos (Spanish)", [esc(ES.text || "")], "A machine translation of the 2026 wording. Nobody re-checked it when the English changed, and no qualified translator ever reviewed it.")}${compare("A Spanish version a qualified translator checked against the current English.", "A 2026 machine translation, never reviewed.", "What the Spanish page shows", "Old, and never checked by a person", "What it should show")}`,

      now: () => `${screen("Translator queue · Pricing disclaimer (Spanish)", ["<b>The English source changed</b> → Spanish version sent back for review", "<b>Machine draft:</b> never served; a qualified translator reviews it", "<b>Until approved:</b> Spanish speakers are offered an interpreter at no cost"])}`,
      fix: ["A translation is linked to its English source; when the English changes, the translation goes back to a qualified translator, and machine drafts are never served", "Spanish-speaking members only read wording a person checked against the current English", "Translations stay in step with English, with an owner and a queue"],
      fixpath: [["ENGLISH", "Updated for 2027", "approved"], ["LINKED", "Spanish version flagged", "source changed"], ["TRANSLATOR", "Qualified person reviews", "machine draft never served"], ["WEBSITE", "Checked Spanish", "or an interpreter"]],
      fix4: { line: "The English page changes, so the Spanish page goes back to a translator.", steps: [0, 1], tech: ["Drift detection", "Translation workflow"], kind: "Rule, then a qualified person", control: "A translated topic is its own approved unit linked to its source; a change to the source flags it for re-review; machine translation produces only a draft, never served.", who: "A qualified translator approves; Renee owns the queue", proof: "Machine-translated draft never served (golden question 12); other languages routed to a translator (test T12)." } }
  }
};

ACT.lead = "Tom, Grace and Dr. Ruth Calloway, the approvers"; ACT.steps = [["Outbound", "Rules check, a person approves"], ["Voice", "Separation of duties"], ["Member chat", "Clinical sign-off"], ["Advocate desk", "Resolve conflicts of authority"], ["Website", "Clocks on every review"], ["Voice", "One alert finds every copy", "Drift"], ["Member chat", "Meaning, not formatting", "Format"], ["Website", "Re-check translations", "Translation"]]; ACT.howIndex = 1;
