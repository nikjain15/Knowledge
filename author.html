<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css?v=5691a8c">
<link rel="stylesheet" href="styles.css?v=5691a8c">
<title>Priya · Lakewell Knowledge</title></head><body>
<main class="area"><div class="phead"><div><p class="eyebrow">Knowledge Operations</p><h1>Priya Nandakumar, author</h1><p>Turns documents into topics, proposes, writes what search could not answer. Never approves her own work.</p></div></div>
<div class="tabs" id="tabs"></div><div id="intro"></div><div id="view"></div></main>
<script src="data.js?v=5691a8c"></script><script src="app.js?v=5691a8c"></script>
<script>
nav("author.html", "author");
const TABS = [["inbox", "Inbox"], ["ingest", "Ingest"], ["dedup", "Dedup"], ["gaps", "Gap queue"], ["fix", "Fixes"]];
let tab = QS.get("tab") || "inbox", docId = QS.get("doc") || "DOC-RXV2";
function go(t, extra) { location.href = "author.html?tab=" + t + (extra || ""); }
function draw() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => `<button aria-pressed="${k === tab}" data-t="${k}">${l}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go(b.dataset.t));
  const I = { inbox: ["Priya's to-do list: documents to ingest, duplicates to check, unanswered questions, items sent back.", "She proposes. She never approves her own work."],
    ingest: ["The source document (left) and what the AI pulled out of it (right).", "Locked lines become locked clauses. Junk and stale lines are skipped. Nothing is searchable until approved."],
    dedup: ["The same disclaimer found in three files, compared word by word.", "The system proposes. It never merges on its own."],
    gaps: ["Questions search could not answer, grouped by topic.", "Each group becomes a proposed unit to write, ranked by how often it was asked."],
    fix: ["Items an approver sent back, with the reason and the exact words.", "Priya edits and resubmits. The approver sees the diff."] }[tab];
  intro("intro", I[0], I[1]);
  ({ inbox, ingest, dedup, gapq, fix: fixes })[tab === "gaps" ? "gapq" : tab]();
}
function inbox() {
  const s = S(), items = [];
  if (!(s.ingested || {})["DOC-RXV2"]) items.push(["IN", "Ingest Rx Education Script v2", "Script library · Pharmacy Education", "author.html?tab=ingest&doc=DOC-RXV2"]);
  if (!(s.ingested || {})["DOC-SD09"]) items.push(["IN", "Ingest Pharmacy_Desk_Reminders_FINAL_v1 (2).docx", "Shared drive · owner unknown · flagged by Renee", "author.html?tab=ingest&doc=DOC-SD09"]);
  if (!s.dedupProposed) items.push(["DU", "Check duplicates: v3 and the Quick Guide 2027 arrived", "Same disclaimer may live in three places", "author.html?tab=dedup"]);
  gaps().filter(g => g.items.some(i => i.flagged) && !g.written).forEach(g => items.push(["GQ", `Unanswered: ${g.name}`, `${g.n} searches · flagged from the desk`, "author.html?tab=gaps&c=" + encodeURIComponent(g.name)]));
  units().filter(u => u.latest.state === "changes requested").forEach(u => items.push(["FX", `Sent back: ${u.title}`, `${u.id} · ${(s.changes[u.id] || {}).reason}`, "author.html?tab=fix&u=" + u.id]));
  document.getElementById("view").innerHTML = `<div class="inbox stack">${items.length ? items.map(i => `<a class="item" href="${i[3]}" style="text-decoration:none;color:inherit"><div class="ic">${i[0]}</div><div><b>${esc(i[1])}</b><div class="small">${esc(i[2])}</div></div><span class="btn sm">Open</span></a>`).join("") : '<div class="quiet">Nothing waiting. Every proposal is with its approver.</div>'}</div>
    <h3 style="margin-top:18px">With approvers now</h3>${withApprovers()}`;
}
function withApprovers() {
  const rows = units().filter(u => ["in review", "awaiting co-sign"].includes(u.latest.state) && u.stage !== "breadth");
  return rows.length ? `<table><thead><tr><th>Unit</th><th>Approver</th><th>State</th><th>Clock</th></tr></thead><tbody>${rows.map(u => `<tr><td><b class="mono">${u.id}</b> ${esc(u.title)}</td><td>${esc(ROLES[u.approver].person)}</td><td>${statePill(u.latest.state)}</td><td>${slaPill(SUBMITTED[u.id] || PLAN.today, u.approver)}</td></tr>`).join("")}</tbody></table>` : '<p class="small">None.</p>';
}
function docHTML(d, on) {
  return `<div class="doc"><p class="small" style="margin:0 0 8px"><b>${esc(d.file || d.title)}</b> · ${esc(d.owner)} · ${esc(d.version)}</p>${d.sections.map(sec => `<h4>${esc(sec.h)}</h4>${sec.blocks.map(b => typeof b === "string" ? `<p class="small" style="font-style:italic">${esc(b)}</p>` :
    b.table ? `<table style="max-width:320px;margin:4px 0"><tbody>${b.table.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table><span class="sid mono small">${b.s}</span>` :
    `<p style="margin:0 0 6px${b.junk ? ";color:var(--muted);text-decoration:" + (on ? "line-through" : "none") : ""}${b.hidden ? ";color:#c9c9c9;font-size:11px" : ""}"><span class="span ${on && !b.junk ? "on" : ""}">${b.verbatim ? '<span class="vtag">Verbatim (Legal)</span> ' : ""}${esc(b.t)}<span class="sid">${b.s}</span></span></p>`).join("")}`).join("")}</div>`;
}
function ingest() {
  const s = S(), d = doc(docId), props = INGEST[docId], ex = (s.extracted || {})[docId], done = (s.ingested || {})[docId];
  const pick = `<div class="seg">${["DOC-RXV2", "DOC-SD09"].map(id => `<button aria-pressed="${id === docId}" data-d="${id}">${esc(doc(id).short)}</button>`).join("")}</div>`;
  const m = s.messy || { M2: "split", M5: "merge" };
  const card = p => {
    if (p.skip) return `<div class="unit rejected"><div class="uhead"><span class="mono">${p.span}</span>${who("AI")}<b>Skipped</b></div><div class="meta">${esc(p.skip)}</div></div>`;
    if (p.dupOf && p.action === "link") return `<div class="unit"><div class="uhead"><span class="mono">${p.span}</span>${who("AI")}<span class="dup">${esc(p.match)}</span></div><div class="meta">${esc(p.note)}</div></div>`;
    if (p.dupOf) return `<div class="unit"><div class="uhead"><span class="mono">${p.span}</span>${who("AI")}<span class="dup">${esc(p.match)} of ${p.dupOf}</span></div><div class="meta">${esc(p.note)}</div><div class="acts"><button class="btn sm ${m.M5 === "merge" ? "on" : ""}" data-m="M5:merge">Propose merge</button><button class="btn sm ${m.M5 === "keep" ? "on" : ""}" data-m="M5:keep">Keep apart</button></div></div>`;
    const u = ALL_BASE().find(x => x.id === p.unit), v = u.versions[0];
    const split = p.split ? `<div class="dup">AI suggests a split: ${esc(p.splitWhy)}</div><div class="acts"><button class="btn sm ${m.M2 === "split" ? "on" : ""}" data-m="M2:split">Split into ${p.split.join(" and ")}</button><button class="btn sm ${m.M2 === "keep" ? "on" : ""}" data-m="M2:keep">Keep as one</button></div>` : "";
    return `<div class="unit"><div class="uhead"><span class="mono">${p.span}</span><span class="uid">${p.translation ? "draft" : u.id}</span><b>${esc(p.translation ? "Spanish draft of the pricing disclaimer" : u.title)}</b>${who("AI")}</div>
      <div class="txt clamp">${p.translation ? esc(u.translations.es.text) : esc(v.text)}</div>${v.clause && !p.translation ? `<div class="locked">${esc(v.clause.text)}</div>` : ""}
      <div class="meta">${esc(p.type || u.type)} · goes to <b>${esc(ROLES[u.approver].person)}</b>${p.clinical ? " (clinical)" : ""}</div>${split}
      <details class="more"><summary>Tags and notes</summary><div class="meta">${(p.tags || [u.area, u.kbs.join(" + ")]).map(t => `<span class="tag">${esc(t)}</span>`).join("")}${p.note ? "<br>" + esc(p.note) : ""}</div></details></div>`;
  };
  document.getElementById("view").innerHTML = `<div class="acts" style="margin-bottom:10px">${pick}<span class="small">${d.messy ? "The real files are messier: boilerplate, stale dates, copies, tables, clinical advice." : "A clean script with two locked lines."}</span></div>
    <div class="two"><div>${docHTML(d, ex)}</div><div class="stack compact">
      ${!ex ? `<div class="card"><h3>Extract</h3><p class="small">${who("AI")} splits the document into topics, types each one, marks locked clauses, skips what is not knowledge, and proposes tags. Nothing is searchable until an approver says yes.</p><button class="btn primary" id="extract">Extract topics</button></div>` :
      props.filter(p => !p.skip).map(card).join("") + (props.some(p => p.skip) ? `<details class="fold"><summary>Skipped lines (${props.filter(p => p.skip).length})</summary>${props.filter(p => p.skip).map(card).join("")}</details>` : "") + (done ? `<div class="quiet">Submitted ${esc(PLAN.today)}. Routed to ${[...new Set(props.filter(p => p.unit).map(p => ROLES[ALL_BASE().find(x => x.id === p.unit).approver].person))].join(", ")}.</div>` : `<button class="btn primary" id="submitIngest">Confirm and submit for review</button>`)}
    </div></div>`;
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => go("ingest", "&doc=" + b.dataset.d));
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const [k, v] = b.dataset.m.split(":"); store.up(x => { x.messy = Object.assign({ M2: "split", M5: "merge" }, x.messy); x.messy[k] = v; }); draw(); });
  const e = document.getElementById("extract"); if (e) e.onclick = () => { store.up(x => { x.extracted = x.extracted || {}; x.extracted[docId] = true; logEv(x, docId, "AI extractor", "extracted", props.length + " spans proposed"); }); draw(); };
  const sb = document.getElementById("submitIngest"); if (sb) sb.onclick = () => { store.up(x => {
    x.ingested = x.ingested || {}; x.ingested[docId] = true; x.messy = Object.assign({ M2: "split", M5: "merge" }, x.messy);
    const ids = props.filter(p => p.unit && !p.translation).flatMap(p => p.split && x.messy.M2 === "split" ? p.split : [p.unit]);
    ids.forEach(id => { const u = ALL_BASE().find(z => z.id === id); logEv(x, id, "author", "submitted for review", "approver by rule: " + ROLES[u.approver].person, 1); });
    ["legal", "clinical", "owner"].forEach(r => { const n = ids.filter(id => ALL_BASE().find(z => z.id === id).approver === r).length; if (n) notify(x, r, `${n} topic${n > 1 ? "s" : ""} from ${doc(docId).short} wait for your approval`, ROLES[r].home); });
    if (docId === "DOC-SD09") { notify(x, "owner", "Stale date found in FINAL_v1 (2).docx (plan year 2025). Merge proposed: closing line into KU-206", "owner.html?tab=access"); logEv(x, "KU-206", "author", "proposed merge", "exact copy found in FINAL_v1 (2).docx"); }
  }); draw(); };
}
function dedup() {
  const s = S();
  if (!s.dedupLoaded) { document.getElementById("view").innerHTML = `<div class="card"><h3>Two new files arrived</h3><p>Rx Education Script v3 (in review, effective 1 Jan 2027) and the Member Benefits Quick Guide 2027. ${who("AI")} reads them and compares every span with the approved units.</p><button class="btn primary" id="loadDedup">Load v3 and the Quick Guide</button></div>`;
    document.getElementById("loadDedup").onclick = () => { store.up(x => { x.dedupLoaded = true; logEv(x, "DOC-QG27", "AI extractor", "extracted", "Quick Guide 2027: 9 topics, 3 locked clauses, 1 planted instruction removed"); logEv(x, "KU-214", "AI extractor", "logged injected instruction", "\"Ignore prior rules...\" found in the source; not copied into the unit");
      notify(x, ["legal", "clinical", "owner"], "Quick Guide 2027 topics wait for approval", "review.html"); }); draw(); }; return; }
  const A = PD_WORDINGS[0].text;
  const rows = PD_WORDINGS.map(w => { const c = dupCheck(A, w.text, true); return `<tr><td><b>${w.label}</b><div class="small">${esc(doc(w.doc).short)} ${w.span}</div></td><td><div class="diff">${w.label === "PD-A" ? esc(w.text) : wdiff(A, w.text)}</div><div class="small">${esc(w.state)}</div></td><td>${w.label === "PD-A" ? "base" : c.j}</td></tr>`; }).join("");
  const t1 = T1_PAIR.map(id => ALL_BASE().find(u => u.id === id)), t1c = dupCheck(t1[0].versions[0].text, t1[1].versions[0].text, false);
  const oon = dupCheck(DOCS[0].sections[6].blocks[0].t, DOCS[1].sections[3].blocks[0].t, true);
  document.getElementById("view").innerHTML = `<div class="card"><div class="acts"><h3 style="margin:0">One clause, three places, three wordings</h3>${who("AI")}<span class="small">locked-clause similarity, word diff against PD-A</span></div>
    <table style="margin-top:8px"><thead><tr><th>Wording</th><th>Text (red removed, green added)</th><th>Similarity</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="two" style="margin-top:12px"><div class="card"><h3>Other findings</h3><ul class="small">
      <li><b>OON-A</b> in v2 and v3: identical (similarity ${oon.j}). Linked, no new unit.</li>
      <li><b>Star statement</b>: the Quick Guide still carries the 2026 line. Kept as KU-207 v1 with its window, which closed on 29 Oct 2026.</li>
      <li><b>Not a duplicate (test T1)</b>: ${t1[0].id} and ${t1[1].id} read alike (similarity ${t1c.j}) but state different deadlines. ${t1c.dup ? '<span class="no">flagged</span>' : '<span class="ok">not flagged</span>'}.</li>
      <li><b>Planted instruction</b> in the Quick Guide's claims page: removed from KU-214 and logged.</li></ul></div>
    <div class="card"><h3>Priya's proposal</h3>${s.dedupProposed ? `<p class="ok">Proposed ${esc(PLAN.today)}. With Tom (locked clause) and Renee.</p>` : ""}
      <ul><li>Keep <b>PD-A</b> as KU-202 v1, approved for 2026.</li><li><b>PD-B</b> stays in review as v2, the 2027 wording.</li><li>Retire <b>PD-C</b>; the Quick Guide links to KU-202 instead.</li></ul>
      <p class="small">${who("Human")} The system never merges. Tom confirms the locked clause; who holds authority over the wording is his call.</p>
      ${s.dedupProposed ? "" : `<button class="btn primary" id="proposeDedup">Send proposal to Tom and Renee</button>`}</div></div>`;
  const p = document.getElementById("proposeDedup"); if (p) p.onclick = () => { store.up(x => { x.dedupProposed = true; logEv(x, "KU-202", "author", "proposed", "keep PD-A; PD-B as 2027 version; retire PD-C"); notify(x, ["legal", "owner"], "Priya proposes: keep PD-A, retire PD-C (Quick Guide). Conflict of authority to resolve", "review.html?as=legal&u=KU-202"); }); draw(); };
}
function gapq() {
  const s = S(), G = gaps(), open = QS.get("c");
  const list = G.map(g => `<div class="item${g.written ? " done" : ""}" data-gap="${esc(g.name)}" style="cursor:pointer"><div class="ic">${g.n}</div><div><b>${esc(g.name)}</b>${g.items.some(i => i.flagged) ? ' <span class="pill warn">flagged today</span>' : ""}<div class="small">${g.items.length} question${g.items.length > 1 ? "s" : ""} clustered by AI · first seen ${esc(g.since)} · ${slaPill(g.since, "gap")}</div><div class="small">Proposed unit: <b>${esc(g.proposal || "")}</b></div></div><span class="btn sm">Open</span></div>`).join("");
  let detail = "";
  const g = G.find(x => x.name === open);
  if (g) {
    const isDental = g.name === "Supplemental benefits";
    detail = `<div class="card"><h3>${esc(g.name)}</h3><table><thead><tr><th>Question as typed</th><th>Role</th><th>Times</th></tr></thead><tbody>${g.items.map(i => `<tr><td>${esc(i.q)}${i.flagged ? ' <span class="pill warn">from the desk</span>' : ""}</td><td>${esc(ROLES[i.role] ? ROLES[i.role].label : i.role)}</td><td>${i.n}</td></tr>`).join("")}</tbody></table>
      <p style="margin-top:10px">${who("AI")} proposes a unit: <b>${esc(g.proposal)}</b>. Source: ${esc(g.source)}.</p>
      ${g.processFix ? `<p class="dup">This looks like a process problem, not missing knowledge. Renee decides.</p>` : ""}
      ${isDental ? (s.authored ? `<p class="ok">Draft ${GAP_DRAFT.id} submitted to Renee ${esc(PLAN.today)}.</p>` : `<div class="stack"><div class="small">Source attached: <b>${esc(doc("DOC-OSB27").title)}</b> ${doc("DOC-OSB27").sections[0].blocks[0].s}</div><div class="paper"><p class="ctx">Source excerpt</p><p style="margin:0">${esc(GAP_DRAFT.sourceText)}</p></div>
        <label class="small">${who("AI")} draft from the source. Edit before sending.</label><textarea id="gapText" rows="3">${esc(GAP_DRAFT.text)}</textarea><button class="btn primary" id="submitGap">Submit to Renee for approval</button></div>`) : ""}</div>`;
  }
  document.getElementById("view").innerHTML = `<div class="split"><div class="inbox stack">${list}</div><div>${detail || '<div class="quiet">Pick a cluster. The empty search is the next task.</div>'}</div></div>`;
  document.querySelectorAll("[data-gap]").forEach(el => el.onclick = () => go("gaps", "&c=" + encodeURIComponent(el.dataset.gap)));
  /* F2: opening a gap item completes story step 10 */
  if (QS.get("c")) store.up(x => { x.gapOpened = QS.get("c"); });
  const sg = document.getElementById("submitGap"); if (sg) sg.onclick = () => { const t = document.getElementById("gapText").value; store.up(x => { x.authored = { text: t, on: PLAN.today }; logEv(x, GAP_DRAFT.id, "author", "drafted from gap", "dental rider; source DOC-OSB27 S2", 1); notify(x, "owner", "Priya wrote KU-230 Optional dental rider to close a gap. Approve it?", "review.html?as=owner&u=KU-230"); }); draw(); };
}
function fixes() {
  const s = S(), list = units().filter(u => (s.changes || {})[u.id]), id = QS.get("u") || (list[0] || {}).id, u = list.find(x => x.id === id);
  if (!u) { document.getElementById("view").innerHTML = '<div class="quiet">Nothing sent back.</div>'; return; }
  const c = s.changes[u.id], rv = (s.revised || {})[u.id];
  document.getElementById("view").innerHTML = `<div class="two"><div class="sendback"><b>Sent back by ${esc(c.by)} · ${esc(c.on)}</b><div><span class="pill bad">${esc(c.reason)}</span></div><div class="small">Quoted text</div><div class="cmt">"${esc(c.quote)}"</div><div class="small">Note</div><div class="cmt">${esc(c.note)}</div>${c.edit ? `<div class="small">Suggested edit</div><div class="cmt">${esc(c.edit)}</div>` : ""}</div>
    <div class="card"><h3>${esc(u.title)} <span class="mono small">${u.id}</span></h3>${rv ? `<p class="ok">Resubmitted ${esc(PLAN.today)}: ${esc(rv.note)}</p><div class="diff">${wdiff(ALL_BASE().find(x => x.id === u.id) ? ALL_BASE().find(x => x.id === u.id).versions[0].text : u.text, rv.text)}</div>` :
      `<textarea id="fixText" rows="4">${esc(u.latest.text)}</textarea><input type="text" id="fixNote" placeholder="What you changed" style="margin-top:8px"><button class="btn primary" id="resubmit" style="margin-top:8px">Resubmit</button>`}</div></div>`;
  const r = document.getElementById("resubmit"); if (r) r.onclick = () => { const t = document.getElementById("fixText").value, n = document.getElementById("fixNote").value || "Corrected as asked"; store.up(x => { x.revised = x.revised || {}; x.revised[u.id] = { text: t, note: n }; logEv(x, u.id, "author", "revised and resubmitted", n, 1); notify(x, u.approver, `Priya resubmitted ${u.title}`, `review.html?as=${u.approver}&u=${u.id}`); }); draw(); };
}
draw();
</script></body></html>
