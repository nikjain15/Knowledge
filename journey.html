<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Journey · Lakewell Knowledge</title></head><body>
<main class="area page"><div class="phead"><div><p class="eyebrow">Deep dive · service design</p><h1>From a source document to an answer, today and after</h1><p>Two journeys share one spine: how knowledge is made (content) and how it is found (finding). Today is assumed from the public record; every key is in the citations register.</p></div></div>
<div class="tabs"><button aria-pressed="true" data-j="now">Today</button><button aria-pressed="false" data-j="next">After the platform</button><button aria-pressed="false" data-j="who">Who decides what</button></div>
<div id="view"></div></main>
<script src="data.js?v=65609d4"></script><script src="app.js?v=65609d4"></script>
<script>
nav("journey.html", "");
intro(null, "How a policy becomes an answer today, and after the platform. Content journey and finding journey.", "Every pain on the left has a matching change on the right, and each change links to its screen.");
const NOW = [
  ["Content", "Legal finalises a disclaimer and emails it to content teams", "Tom", "The wording lives in a message, not a system", "BR-01"],
  ["Content", "Each channel team pastes it into its own documents", "Priya and peers", "Three wordings of one clause drift apart", "BR-01, FM-15"],
  ["Content", "Documents are reviewed as whole files inside CMS clocks", "Compliance", "One change means many reviews", "R-20"],
  ["Content", "Approved documents load into the advocate library", "Knowledge Ops", "No state or effective date at the unit (assumed)", "H-15"],
  ["Content", "Agent Assist points at a store of documents", "Technology", "The AI reads whatever is published; nothing checks the unit", "H-03, V-07, V-14"],
  ["Finding", "Dana searches the library and two other tools", "Dana", "Documents, not answers; no way to tell which is current", "BR-01, J-15"],
  ["Finding", "Dana reads one wording; the copilot shows another", "Dana, Agent Assist", "Two wordings on one call", "BR-01"],
  ["Finding", "Luis searches and gets a third document", "Luis", "No role scoping (assumed)", "assumed"],
  ["Finding", "No answer ends in a callback; nothing logs it", "Dana", "Knowledge Ops never sees what was missed", "BR-01, J-01"],
  ["Content", "Legal revises; nobody can find every copy", "Tom, Priya", "Stale copies survive", "FM-01"]];
const NEXT = [
  ["Content", "Ingest once; AI proposes topics, exact wording, tags, spans", "AI, then Priya", "One source, many units", "BR-01", "author.html?tab=ingest"],
  ["Content", "AI finds one clause in three places; Priya proposes; nothing auto-merges", "AI proposes, Priya decides", "Duplicates found, never silently merged", "R-49, V-23", "author.html?tab=dedup"],
  ["Content", "Tom approves the topic once; approver, date, window recorded", "Tom", "One approval serves every channel", "FM-26, FM-27", "review.html?as=legal"],
  ["Content", "Units go live on their effective date and retire on expiry", "Rule", "Nothing outside its window is served", "R-09", "drift.html"],
  ["Finding", "Dana asks; one cited unit, scoped to her bases", "Dana", "One answer, cited, exact wording word for word", "BR-01", "desk.html?role=insurance&call=C1"],
  ["Finding", "Luis asks the same; never sees Insurance-only content", "Luis", "Scope is a pre-filter", "plan 5", "desk.html?role=pharmacy&call=C7"],
  ["Finding", "Agent Assist and member chat read the same unit", "Channels", "One unit, many channels", "H-02, V-07", "chat.html"],
  ["Finding", "No approved answer: said honestly, sent to Priya's queue", "Rule, then Priya", "The empty search is the backlog", "BR-01", "author.html?tab=gaps"],
  ["Content", "Legal edits the source; one grouped alert; Tom approves once", "AI proposes, Tom approves", "Every channel updates at once", "BR-01", "drift.html"],
  ["Finding", "QA samples answers weekly, 30 per role", "Quality team", "Errors found before a member hears them twice", "TH-29", "evals.html"]];
function draw(k) {
  document.querySelectorAll("[data-j]").forEach(b => b.setAttribute("aria-pressed", b.dataset.j === k));
  const t = rows => `<table><thead><tr><th>Journey</th><th>Step</th><th>Who</th><th>${k === "now" ? "Pain" : "Change"}</th><th>Keys</th>${k === "next" ? "<th></th>" : ""}</tr></thead><tbody>${rows.map(r => `<tr><td><span class="pill ${r[0] === "Finding" ? "leaf" : "design"}">${r[0]}</span></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="${k === "now" ? "no" : "ok"}" style="font-weight:600">${esc(r[3])}</td><td class="small mono">${esc(r[4])}</td>${r[5] ? `<td><a href="${r[5]}">See it</a></td>` : ""}</tr>`).join("")}</tbody></table>`;
  document.getElementById("view").innerHTML = k === "who" ? `<div class="card"><h3>The brief's AI table, one click per cell (D44)</h3><table><thead><tr><th>Who</th><th>Item</th><th>Where in the prototype</th></tr></thead><tbody>${DECISION_ITEMS.map(d => `<tr><td>${d[0] === "Human only" ? who("Human") : who("AI")} ${esc(d[0])}</td><td>${esc(d[1])}</td><td><a href="${d[3]}">${esc(d[2])}</a></td></tr>`).join("")}</tbody></table></div>`
    : `<div class="card">${t(k === "now" ? NOW : NEXT)}</div>`;
}
document.querySelectorAll("[data-j]").forEach(b => b.onclick = () => draw(b.dataset.j));
draw("now");
</script></body></html>
