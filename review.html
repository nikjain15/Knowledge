<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css?v=d81cdd5">
<link rel="stylesheet" href="styles.css?v=d81cdd5">
<title>Review · Lakewell Knowledge</title></head><body>
<main class="area"><div class="phead" id="head"></div><div id="intro"></div><div class="split"><div id="queue"></div><div id="detail"></div></div></main>
<script src="data.js?v=d81cdd5"></script><script src="app.js?v=d81cdd5"></script>
<script>
const REVIEWERS = ["legal", "clinical", "owner", "medical"];
const AS = REVIEWERS.includes(QS.get("as")) ? QS.get("as") : QS.get("as") === null ? "legal" : null;
nav("review.html", AS);
/* F16: an unknown reviewer link never defaults to someone; pick a reviewer first */
if (!AS) { document.querySelector("main").innerHTML = `<div class="empty" style="margin-top:24px"><p><b>No reviewer matches this link.</b> Nothing can be approved until you choose who is reviewing.</p><div class="acts" style="justify-content:center">${REVIEWERS.map(r => `<a class="btn sm" href="review.html?as=${r}">${esc(P(r))}</a>`).join("")}</div></div>`; }
if (AS) {
const ROLE_TEXT = { legal: "Approves CMS-controlled and legal wording, exact wording and appeals. Resolves conflicts of authority.", clinical: "Approves pharmacy and clinical content. Sends back what the source does not support.", owner: "Approves operational content and gap units, confirms merges.", medical: "Second sign-off on clinical guidance only, after Grace. Our control (J): CMS requires a medical director for coverage decisions (AP-07), not for member education." };
document.getElementById("head").innerHTML = `<div><p class="eyebrow">Approval gate</p><h1${ROLES[AS].note ? ` title="${esc(ROLES[AS].note)}"` : ""}>${esc(P(AS))}</h1><p>${ROLE_TEXT[AS]}</p></div><div class="right"><div class="seg">${["legal", "clinical", "owner", "medical"].map(r => `<button aria-pressed="${r === AS}" onclick="location.href='review.html?as=${r}'">${ROLES[r].person.split(" ")[0]}</button>`).join("")}</div></div>`;
intro("intro", "The approver's queue (left) and the item under review (right).", "Approve stays locked until every check is ticked. The AI runs the checks; only a person confirms the answer is correct.");
const mine = () => units().filter(u => !(S().reassigned || {})[u.id]).filter(u => (u.approver === AS && ["in review", "changes requested"].includes(u.latest.state) && !(u.id === "KU-202" && u.versions[0].state === "approved")) || (u.latest.state === "awaiting co-sign" && secondSigner(u) === AS))
  .map(u => u.id === "KU-202" && u.versions[0].state !== "approved" ? Object.assign(u, { reviewV: u.versions[0] }) : Object.assign(u, { reviewV: u.latest }));
let sel = QS.get("u");
function grade(t) { const w = t.split(/\s+/).length, sents = (t.match(/[.!?]/g) || [1]).length, syl = t.split(/\s+/).reduce((a, x) => a + Math.max(1, (x.toLowerCase().match(/[aeiouy]+/g) || []).length), 0); return Math.max(1, Math.round(0.39 * w / sents + 11.8 * syl / w - 15.59)); }
function spanText(u) { if (u.synthetic) return u.latest.text; const d = doc(u.doc); const ids = u.span.replace(/\(.*\)/, "").split(",").map(x => x.trim()); return d.sections.flatMap(s => s.blocks).filter(b => typeof b !== "string" && ids.includes(b.s)).map(b => b.t).join(" "); }
function queue() {
  const q = mine(); if (!sel && q[0]) sel = q[0].id;
  const extra = AS === "owner" && (S().messy || {}).M5 !== "keep" && (S().ingested || {})["DOC-SD09"] && !(S().merged || {})["KU-206"] ? `<div class="item" style="cursor:pointer" id="mergeItem"><div class="ic">MG</div><div><b>Merge proposed: closing line into KU-206</b><div class="small">Exact copy in FINAL_v1 (2).docx · proposed by Priya</div></div></div>` : "";
  document.getElementById("queue").innerHTML = `<div class="inbox stack">${q.length ? q.map(u => `<div class="item click${u.id === sel ? " urgent" : ""}" data-u="${u.id}" style="cursor:pointer"><div class="ic">${u.id.slice(3)}</div><div><b>${esc(u.title)}</b><div class="small">${statePill(u.latest.state)} ${u.reviewV.clause ? '<span class="pill lock">exact wording</span>' : ""} ${(c => slaPill(c.since, c.kind) + (c.e2eMissed ? ' <span class="pill bad">end to end ' + c.e2e.used + ' of ' + c.e2e.lim + ' working days · Renee notified</span>' : ""))(clockOf(u))}</div></div></div>`).join("") : (S().dedupLoaded || (S().ingested || {})["DOC-RXV2"] ? emptyState(`Nothing waiting for ${esc(ROLES[AS].person)}. Everything submitted to ${esc(FIRST(AS))} has been decided; see the audit on Renee's page.`) : emptyState(`Nothing waiting for ${esc(ROLES[AS].person)} yet. Items arrive when Priya submits a document.`, "Load the demo up to the gate", () => { store.up(ENSURE.ingestAll); location.reload(); }))}${extra}</div>`;
  document.querySelectorAll("[data-u]").forEach(el => el.onclick = () => { sel = el.dataset.u; draw(); });
  const mi = document.getElementById("mergeItem"); if (mi) mi.onclick = () => { store.up(x => { x.merged = x.merged || {}; x.merged["KU-206"] = true; logEv(x, "KU-206", "owner", "confirmed merge", "closing line in FINAL_v1 (2).docx now points to KU-206"); }); draw(); };
}
function detail() {
  const s = S(), u = mine().find(x => x.id === sel), el = document.getElementById("detail");
  if (!u) { el.innerHTML = mine().length ? '<div class="empty"><p>Pick an item on the left.</p></div>' : ""; return; }
  const v = u.reviewV, src = spanText(u), w = u.searches || 4;
  const cos = u.latest.state === "awaiting co-sign";
  const checks = [
    ["AI", "Text matches the source span", `${doc(u.doc).short} ${u.span}; similarity ${dupCheck(src, v.text + " " + ((v.clause || {}).text || ""), true).j}`],
    v.clause ? ["AI", "Exact wording is character-exact", `fingerprint ${fp(v.clause.text)} equals source ${fp(src.includes(v.clause.text) ? v.clause.text : src)}`] : null,
    ["AI", "Dates set", `effective ${v.effective}, review by ${v.expiry}`],
    ["AI", "Base and audience", `${u.kbs.join(", ")} base · ${u.memberFacing ? "member-facing" : "advocate only"}`],
    ["AI", "Channels allowed", u.channels.join(", ") + (v.clause ? " · never by text message" : "")],
    ["AI", "Reading level", `about grade ${grade(v.text)} (rough estimate)`],
    u.clinical ? ["AI", "Clinical guidance", "routed to a clinical reviewer by type"] : null,
    ["Human", "The answer is correct and complete", "Only a person confirms this"]].filter(Boolean);
  const conflict = u.id === "KU-202" && s.dedupProposed ? `<div class="card flat" style="margin-top:12px"><h3>Conflict of authority ${who("Human")}</h3><p class="small">Member Communications wrote PD-C in the Quick Guide; Legal approved PD-A in the script. Which wording holds authority?</p>
    <div class="acts"><button class="btn sm ${s.conflictResolved ? "on" : ""}" id="conflictLegal" ${s.conflictResolved ? "disabled" : ""}>Legal's PD-A holds; retire PD-C</button><button class="btn sm" id="conflictMC" ${s.conflictResolved ? "disabled" : ""}>Adopt PD-C</button></div>
    ${u.retiredWording ? `<div class="diff" style="margin-top:8px">${wdiff(v.clause.text, u.retiredWording.text)}</div><div class="small">PD-C: ${statePill(s.conflictResolved ? "retired" : "proposed to retire")}</div>` : ""}</div>` : "";
  const ch = (s.changes || {})[u.id], suggest = u.fix ? { reason: "Source does not support this wording", quote: u.fix.from, note: `${u.fix.why}. Please correct the Tier 5 value.`, edit: u.fix.to } : { reason: SEND_BACK_REASONS[0], quote: "", note: "", edit: "" };
  el.innerHTML = `<div class="card"><div class="acts"><span class="uid mono">${u.id} v${v.v}</span><h2 style="margin:0">${esc(u.title)}</h2>${statePill(u.latest.state)}</div>
    <p class="small">${esc(tagLine(u))} · ${u.synthetic ? "synthetic queue item" : "from " + esc(doc(u.doc).title) + " " + esc(u.span)} · submitted by Priya Nandakumar${u.revisedNote ? " · revised: " + esc(u.revisedNote) : ""}</p>
    <div class="txt" style="font-size:15px">${esc(v.text)}</div>${v.clause ? `<div class="locked" style="margin-top:8px">${esc(v.clause.text)}</div>` : ""}
    ${u.injection ? `<div class="blocked" style="margin-top:8px">Planted instruction found in the source and removed: "${esc(u.injection)}"</div>` : ""}
    <p class="small" style="margin-top:10px"><b>Impact if published:</b> ${w} searches a week (illustrative) · ${u.channels.length} channels · ${needsCosign(u) ? "needs a second sign-off from " + esc(ROLES[secondSigner(u)].person) : "no second sign-off needed"}</p>
    ${conflict}
    ${cos ? (secondSigner(u) === AS ? `<div class="card flat" style="margin-top:12px"><h3>Second sign-off ${who("Human")}</h3><p class="small">First signed by ${esc(P(u.approver))}${u.latest.firstSign ? " on " + esc(u.latest.firstSign.on) : ""}. Clinical guidance gets a second clinical look before it goes live (D53). A dated choice keeps it scheduled until that day.</p>
      <div class="acts"><select id="pubWhen" style="width:auto"><option value="now">Publish now</option><option value="after 6 PM call peak">After the 6 PM call peak</option><option value="1 Jan 2027">On 1 Jan 2027</option></select><button class="btn primary" id="cosign">Co-sign</button></div></div>` : `<p class="quiet" style="margin-top:12px">Waiting for ${esc(P(secondSigner(u)))} to co-sign.</p>`) :
    ch && !(s.revised || {})[u.id] ? `<div class="quiet" style="margin-top:12px">Sent back ${esc(ch.on)}. Waiting for Priya.</div>` : `
    <h3 style="margin-top:14px">Checklist</h3><div class="chk">${checks.map((c, i) => `<label class="ci"><input type="checkbox" data-i="${i}"><span><b>${who(c[0])} ${esc(c[1])}</b><span class="small">${esc(c[2])}</span></span></label>`).join("")}</div>
    <div class="acts" style="margin-top:10px"><label class="small">In force from <input type="text" id="eff" value="${esc(v.effective)}" style="width:130px"></label><label class="small">Review by <input type="text" id="exp" value="${esc(v.expiry)}" style="width:130px"></label></div>
    <div class="acts" style="margin-top:10px"><button class="btn primary" id="approve" disabled>Approve</button><button class="btn danger" id="openSend">Send back</button></div>
    <div class="sendback" id="sendform" hidden><b>Send back to Priya</b><span class="small">${who("AI")} drafted this from the checks; edit it.</span>
      <select id="sbReason">${SEND_BACK_REASONS.map(r => `<option${r === suggest.reason ? " selected" : ""}>${r}</option>`).join("")}</select>
      <input type="text" id="sbQuote" placeholder="Quote the exact words" value="${esc(suggest.quote)}"><textarea id="sbNote" rows="2" placeholder="What is wrong (required)">${esc(suggest.note)}</textarea><input type="text" id="sbEdit" placeholder="Suggested edit (optional)" value="${esc(suggest.edit)}">
      <button class="btn danger" id="sendback">Send back</button></div>`}
    <details class="more"${((s.comments || {})[u.id] || []).length ? " open" : ""}><summary>Comments (${((s.comments || {})[u.id] || []).length})</summary><div class="stack" style="margin-top:6px">${((s.comments || {})[u.id] || []).map(c => `<div class="cmt"><b>${esc(c.by)}</b> ${esc(c.t)}</div>`).join("")}<div class="acts"><input type="text" id="cmt" placeholder="Add a comment"><button class="btn sm" id="addCmt">Add</button></div></div></details>
    <details class="more"><summary>Audit trail</summary>${timelineHTML(u)}</details></div>`;
  const boxes = [...el.querySelectorAll(".chk input")], ap = document.getElementById("approve");
  boxes.forEach(b => b.onchange = () => { if (ap) ap.disabled = !boxes.every(x => x.checked) || (u.id === "KU-202" && s.dedupProposed && !S().conflictResolved); });
  const cl = document.getElementById("conflictLegal"); if (cl) cl.onclick = () => { store.up(x => { x.conflictResolved = { by: "legal", on: PLAN.today, choice: "legal" }; logEv(x, "KU-202", "legal", "resolved conflict of authority", "Legal-approved PD-A holds; PD-C retired; Quick Guide links to KU-202"); notify(x, ["author", "owner"], "Tom resolved the disclaimer conflict: PD-A holds, PD-C retires", "author.html?tab=dedup"); }); const keep = boxes.map(b => b.checked); detail(); [...document.querySelectorAll(".chk input")].forEach((b, i) => { b.checked = keep[i]; b.onchange(); }); };
  if (ap) ap.onclick = () => { const eff = document.getElementById("eff").value, exp = document.getElementById("exp").value;
    store.up(x => { x.approved = x.approved || {}; const k = u.id === "KU-207" ? "KU-207@v2" : u.id; x.approved[k] = { by: AS, on: PLAN.today, eff, exp };
      logEv(x, u.id, AS, "approved v" + v.v, `checklist complete; in force ${eff} to ${exp}`, v.v);
      if (needsCosign(u)) notify(x, secondSigner(u), `${u.title} needs your second sign-off`, `review.html?as=${secondSigner(u)}&u=${u.id}`); else notify(x, "author", `${ROLES[AS].person} approved ${u.title}`, "author.html"); });
    sel = null; draw(); };
  const os = document.getElementById("openSend"); if (os) os.onclick = () => document.getElementById("sendform").hidden = false;
  const sb = document.getElementById("sendback"); if (sb) sb.onclick = () => { const note = document.getElementById("sbNote").value.trim(); if (!note) { document.getElementById("sbNote").focus(); return; }
    store.up(x => { x.changes = x.changes || {}; x.changes[u.id] = { reason: document.getElementById("sbReason").value, quote: document.getElementById("sbQuote").value, note, edit: document.getElementById("sbEdit").value, by: P(AS), on: PLAN.today }; if (x.revised) delete x.revised[u.id];
      logEv(x, u.id, AS, "sent back", x.changes[u.id].reason, v.v); notify(x, "author", `${ROLES[AS].person} sent back ${u.title}: ${x.changes[u.id].reason}`, "author.html?tab=fix&u=" + u.id); }); draw(); };
  const co = document.getElementById("cosign"); if (co) co.onclick = () => { const when = document.getElementById("pubWhen").value; store.up(x => { if (recordCosign(x, u, AS, when, v.v)) notify(x, ["author", u.approver], `${u.title} co-signed; ${dayOK(when) ? "scheduled, starts " + when : "publishes " + when}`, "author.html"); }); sel = null; draw(); };
  document.getElementById("addCmt").onclick = () => { const t = document.getElementById("cmt").value.trim(); if (!t) return; store.up(x => { x.comments = x.comments || {}; (x.comments[u.id] = x.comments[u.id] || []).push({ by: ROLES[AS].person, t }); logEv(x, u.id, AS, "commented", t); }); detail(); };
}
function draw() { queue(); detail(); }
draw();
}
</script></body></html>
