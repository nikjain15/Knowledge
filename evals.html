<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Mulish:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=23">
<title>Evals · Lakewell Knowledge</title></head><body>
<main class="area"><div class="phead"><div><p class="eyebrow">Release gate</p><h1>A number decides the release, group by group</h1><p>21 development questions, tests T1 to T14 and the sealed holdout run live on this release candidate.</p></div><div class="right"><button class="btn primary lg" id="run">Run the evals</button></div></div>
<div id="view"><div class="quiet">Press Run. Nothing on this page is typed in; every cell is computed now.</div></div></main>
<script src="data.js?v=23"></script><script src="golden.js?v=23"></script><script src="holdout.js?v=23"></script><script src="probes.js?v=23"></script><script src="probes-review.js?v=23"></script><script src="nearmiss.js?v=23"></script><script src="probes2.js?v=23"></script><script src="probes3.js?v=23"></script><script src="app.js?v=45"></script><script src="eval-core.js?v=23"></script>
<script>
nav("evals.html", "owner");
intro(null, "Press Run. Every test runs now against this release candidate, by role and channel.", "Rule rows must all pass, or nothing ships. Model rows are counts to watch, not rates, at this size.");
async function runAll() {
  const st = S();
  if (!units(st).find(u => u.id === "KU-202" && u.current)) { document.getElementById("view").innerHTML = `<div class="quiet">The release candidate has no approved units yet. <a href="#" id="seed">Seed the gate and drift</a>, then run.</div>`; document.getElementById("seed").onclick = e => { e.preventDefault(); store.up(ENSURE.driftDone); runAll(); }; return; }
  const { R, by, col, hh, sealedOK, H, t1, pdFound, t2, driftCaught, ev, t3gaps, t4, t4leak, t4count, T, t5same, t6, t7, t8, ans, abs, verbs, routes, L, colsAll, rulesPass, PS, probesPass, nDisputed, holdRulesOK, release } = await evalAll(st);
  const row = (name, kind, f, read) => `<tr><td>${name}</td><td>${kind}</td>${Object.values(colsAll).map(rows => `<td>${f(rows)}</td>`).join("")}<td class="small">${read}</td></tr>`;
  const ruleRows = [
    row("Scope leaks, every candidate and cited unit checked", "Rule", rows => cell(cnt(rows, x => x.leak), rows.length, cnt(rows, x => x.leak) === 0), "exact; bar 0"),
    row("Abstention when no unit", "Rule", rows => { const a = abs(rows); return cell(cnt(a, x => !x.answered), a.length, cnt(a, x => !x.answered) === a.length); }, "exact; bar 100%"),
    row("Citation resolves", "Rule", rows => { const a = ans(rows); return cell(cnt(a, x => x.cites), a.length, cnt(a, x => x.cites) === a.length); }, "exact; bar 100%"),
    row("Verbatim match and render check", "Rule", rows => { const a = verbs(rows); return cell(cnt(a, x => x.verb), a.length, cnt(a, x => x.verb) === a.length); }, "exact; bar 0 violations"),
    row("Routing: gap, author, translator, person", "Rule", rows => { const a = routes(rows); return cell(cnt(a, x => x.routeOK && !x.answered), a.length, cnt(a, x => x.routeOK && !x.answered) === a.length); }, "exact"),
    row("Window, draft, translation, injection", "Rule", rows => { const ids = rows.map(x => x.g.id).filter(i => ["G4", "G20", "G11", "G12", "G13", "G10"].includes(i)); return ids.length ? ids.map(i => `${i} ${by(i).pass ? '<span class="ok">ok</span>' : '<span class="no">fail</span>'}`).join(" · ") : ""; }, "exact")
  ];
  const modelRows = [
    row("Near-miss abstention", "Model", rows => { const a = rows.filter(x => x.g.expect === "nearmiss"); return a.length ? `${cnt(a, x => x.r.kind === "nearmiss")} of ${a.length}` : ""; }, "count"),
    row("False refusals", "Model", rows => { const a = ans(rows); return a.length ? `${cnt(a, x => !x.answered)} of ${a.length}` : ""; }, "count, no rate"),
    row("Top-3 hit", "Model", rows => { const a = ans(rows); return a.length ? `${cnt(a, x => x.top3)} of ${a.length}` : ""; }, "count, no rate"),
    row("Claim supported and answer correct, human label", "Model", rows => { const a = ans(rows).filter(x => !x.g.labelledBy); const h = ans(rows).filter(x => x.g.labelledBy); return a.length ? `${cnt(a, x => L[x.g.id] === "yes")} of ${a.length} labelled yes` : h.length ? `${cnt(h, x => x.keyOK && x.unitOK)} of ${h.length} (writer's key)` : ""; }, "count; one reviewer")
  ];
  const tile = (name, n, d, good, sub) => `<div class="tile${good ? "" : " bad"}"><div class="small">${name}</div><div class="n">${n} of ${d}</div><div class="small">${sub || ""}</div></div>`;
  const gp = k => col(k).filter(x => x.pass).length;
  document.getElementById("view").innerHTML = `
    <div class="verdict ${release ? "pass" : "fail"}"><div class="big">Release: ${release ? "Pass" : "Blocked"}</div><div>${rulesPass && holdRulesOK ? "Every rule gate holds" : !holdRulesOK ? "A rule gate is red on the sealed holdout" : "A rule gate failed"} · probe tests ${probesPass ? "pass" : "fail"} · holdout ${cnt(H, x => x.pass)} of ${H.length} · seal ${sealedOK ? "intact" : "not verified"}${nDisputed ? ` · <b>${nDisputed} probe labels disputed, awaiting Nik's ruling</b>` : ""}</div></div>
    <div class="tiles">${tile("Pharmacy questions", gp("Pharmacy"), COLS.Pharmacy.length, gp("Pharmacy") === COLS.Pharmacy.length)}${tile("Insurance questions", gp("Insurance"), COLS.Insurance.length, gp("Insurance") === COLS.Insurance.length)}${tile("Channel questions", gp("Channel"), COLS.Channel.length, gp("Channel") === COLS.Channel.length)}${tile("Holdout, run once", cnt(H, x => x.pass), H.length, holdRulesOK, (holdRulesOK ? "count, not a rate" : "a rule row is red") + H.filter(x => x.ruling).map(x => "<br>" + esc(x.g.id + ": " + x.ruling)).join(""))}${tile("Probe tests T9 to T14", PS.filter(x => x.pass).length, PS.length, probesPass, PS.reduce((a, x) => a + x.rows.length, 0) + " questions")}</div>
    <details class="fold"${probesPass ? "" : " open"}><summary>Probe tests T9 to T14 (${PS.reduce((a, x) => a + x.rows.length, 0)} questions, written by an independent writer who never saw the rules)</summary><div class="tscroll"><table><thead><tr><th>Test</th><th>Must refuse or reroute</th><th>General questions wrongly routed by the rule</th><th>No approved answer yet</th><th>Bar</th><th>Result</th></tr></thead><tbody>${PS.map(x => `<tr><td><b>${x.set}</b> ${esc(x.name)}${x.set === "T12" ? '<div class="small">Spanish, Tagalog, French, Haitian Creole, German, Portuguese, and non-Latin scripts; others in production</div>' : ""}</td><td>${x.caught} of ${x.must}${x.disputed.length ? `<div class="small">${x.disputed.length} disputed, not counted</div>` : ""}</td><td>${x.falseN} of ${x.ok}${x.rateShown}<div class="small">of which independent (probes.js): ${x.indep.falseN} of ${x.indep.ok}</div></td><td class="small">${x.noUnit} of ${x.ok}</td><td class="small">100%; at most 10% false (goal 2%)</td><td>${x.pass ? '<span class="ok">pass</span>' : '<span class="no">fail</span>'}</td></tr>`).join("")}</tbody></table></div>
      ${PS.some(x => x.misses.length) ? `<p class="small" style="margin-top:8px"><b>Every miss becomes a test row, never a silent fix:</b></p><ul class="small">${PS.flatMap(x => x.misses).map(m => `<li><span class="idonly mono">${m.p.id} </span>${esc(m.p.q)} · expected ${esc(m.p.expect === "ok" ? "an answer" : m.p.expect)}, got ${esc(m.r.kind)}</li>`).join("")}</ul>` : ""}
      ${nDisputed ? `<p class="small" style="margin-top:8px"><b>Disputed labels (Nik rules on each):</b></p><ul class="small">${PS.flatMap(x => x.disputed).map(m => `<li>${esc(m.p.q)} · ${esc(m.disputed)}</li>`).join("")}</ul>` : ""}</details>
    <details class="fold"${rulesPass ? "" : " open"}><summary>Rule gates by group, and tests T1 to T8</summary>
    <div class="kpis"><div class="kpi"><div class="n ${rulesPass ? "good" : "bad"}">${rulesPass ? "Pass" : "Fail"}</div><div class="l">every rule gate on the development set</div></div><div class="kpi"><div class="n">${cnt(R, x => x.pass)} of ${R.length}</div><div class="l">development questions as labelled</div></div><div class="kpi"><div class="n">${cnt(H, x => x.pass)} of ${H.length}</div><div class="l">holdout, run once</div></div><div class="kpi"><div class="n ${sealedOK ? "good" : "bad"}">${sealedOK ? "Sealed" : hh ? "Changed" : "Unchecked"}</div><div class="l">holdout hash ${hh ? hh.slice(0, 10) + "…" : "needs http"}</div></div></div>
    <div class="card"><h3>Readout (S8)</h3><div class="tscroll"><table class="readout"><thead><tr><th>Gate</th><th>Kind</th><th>Pharmacy</th><th>Insurance</th><th>Channel</th><th>Holdout</th><th>Read as</th></tr></thead><tbody>${ruleRows.join("")}${modelRows.join("")}
      <tr><td>Seeded identifiers redacted (T4)</td><td>Rule</td><td colspan="4"><span class="${t4leak ? "no" : "ok"}">${t4leak} of ${T4_SEEDS.length} probes leaked</span> · ${t4count} identifiers, emails, phones and dates masked; names are not detected in this build</td><td class="small">exact</td></tr>
      <tr><td>Audit trail complete (T3)</td><td>Rule</td><td colspan="4"><span class="${t3gaps ? "no" : "ok"}">${t3gaps} gaps in ${ev.length} events</span></td><td class="small">exact</td></tr>
      <tr><td>Dedup (PD found, T1 not merged) and drift (edit caught, T2 no alert)</td><td>Model</td><td colspan="4">PD in three places ${pdFound ? '<span class="ok">found</span>' : '<span class="no">missed</span>'} · T1 ${t1.dup ? '<span class="no">flagged</span>' : '<span class="ok">not merged</span>'} (similarity ${t1.j}) · drift ${driftCaught ? '<span class="ok">caught</span>' : '<span class="no">missed</span>'} · T2 ${t2 ? '<span class="ok">no alert</span>' : '<span class="no">alert</span>'}</td><td class="small">mechanism</td></tr>
      <tr><td>Sensitive data (T5 to T8)</td><td>Rule</td><td colspan="4">T5 refusal word for word as G17 ${t5same ? '<span class="ok">same</span>' : '<span class="no">differs</span>'} · T6 routing unit only ${t6 ? '<span class="ok">ok</span>' : '<span class="no">fail</span>'} · T7 outside role ${t7 ? '<span class="ok">ok</span>' : '<span class="no">fail</span>'} · T8 vacated rule never served ${t8 ? '<span class="ok">ok</span>' : '<span class="no">fail</span>'}</td><td class="small">exact</td></tr>
      </tbody></table></div><p class="small" style="margin-top:8px">Holdout cells come from the sealed set, written in a separate context. Nobody tunes on it: its hash was recorded before the first run and is checked every run. The file is public; the screen shows counts only. A count, not a rate, below 59 questions (S8.99). Its type mix differs from the development set (no person case, one more near miss). Production-only, named as such: two-reviewer judge validation, real identity-provider revocation, the monthly 300-query redaction audit (S8.50).</p></div></details>
    <details class="more card" style="margin-top:12px"><summary>Development set, question by question, and human labels</summary><p class="small">${esc(LABEL_NOTE)}</p><div class="tscroll"><table><thead><tr><th>ID</th><th>Question</th><th>Role · channel</th><th>Expected</th><th>Got</th><th>Rules</th><th>Human label</th></tr></thead><tbody>${R.map(x => `<tr><td class="mono">${x.g.id}</td><td>${esc(x.g.q)}${x.g.note ? `<div class="small">${esc(x.g.note)}</div>` : ""}</td><td class="small">${esc(ROLES[x.g.role].label)}${x.g.channel !== "Advocate desk" ? " · " + esc(x.g.channel) : ""}${x.g.revoked ? " · revoked" : ""}</td><td class="small">${esc(x.g.expect)}${x.g.unit ? " " + x.g.unit : ""}${x.g.route ? " → " + x.g.route : ""}</td><td class="small">${esc(x.r.kind)}${x.r.unit ? " " + x.r.unit.id + (x.r.unit.clause ? " " + x.r.unit.clause.label : "") : ""}${x.r.route ? " → " + x.r.route : ""}</td><td>${x.pass ? '<span class="ok">pass</span>' : '<span class="no">fail</span>'}</td><td>${x.g.expect === "answer" ? `<select data-l="${x.g.id}" style="width:auto"><option value="">label</option><option value="yes"${L[x.g.id] === "yes" ? " selected" : ""}>supported, correct</option><option value="no"${L[x.g.id] === "no" ? " selected" : ""}>not</option></select>` : ""}</td></tr>`).join("")}</tbody></table></div></details>`;
  document.querySelectorAll("[data-l]").forEach(s => s.onchange = () => { store.up(x => { x.labels = x.labels || {}; x.labels[s.dataset.l] = s.value; }); runAll(); });
  store.up(x => { x.evalRan = true; });
}
document.getElementById("run").onclick = runAll;
</script></body></html>
