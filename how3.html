window.ACT = {

      ["stamp", "Written once, approved, for everyone", "Priya drafts; the owner approves; every channel serves it."], ["shield", "Some gaps are process problems", "Renee sends them to the team that can fix the cause."], ["lock", "The top question gets one pinned answer", "Confirmed by Renee, still under every rule."]] }
