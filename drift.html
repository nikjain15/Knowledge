<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css?v=65609d4">
<link rel="stylesheet" href="styles.css?v=65609d4">
<title>Drift · Lakewell Knowledge</title></head><body>
<main class="area"><div class="phead"><div><p class="eyebrow">Drift</p><h1>A source changes; every place it lives is found</h1><p></p></div></div><div id="view"></div></main>
<script src="data.js?v=65609d4"></script><script src="app.js?v=65609d4"></script>
<script>
nav("drift.html", "legal");
intro(null, "Tom edits the source script, and the system checks every place that wording lives.", "A formatting fix raises nothing. A wording change raises one alert listing every place, and one approval updates them all.");
document.querySelector(".phead p:last-child").textContent = "Tom Bexley edits Rx Education Script v3. The AI diffs the tracked spans, raises one grouped alert, and proposes the change. Tom approves once.";
function draw() {
  const s = S(), u = units().find(x => x.id === "KU-202");
  if (!u || !s.dedupLoaded) { document.getElementById("view").innerHTML = `<div class="quiet">v3 has not been loaded yet. Run Dedup first, or <a href="#" id="seed">seed the gate</a>.</div>`; document.getElementById("seed").onclick = e => { e.preventDefault(); store.up(ENSURE.gateDone); draw(); }; return; }
  const oonOld = DOCS[1].sections[3].blocks[0].t, pdOld = PD_WORDINGS[1].text;
  const fmtChanged = norm(oonOld) !== norm(OON_FORMAT_EDIT);
  const places = [["Unit", "KU-202 Rx pricing and the pricing disclaimer (PD)"], ["Documents", "Rx Script v2 S4 (PD-A, 2026) · Rx Script v3 S4 (this edit) · Quick Guide 2027 S4 (PD-C retired, links to KU-202) · FINAL_v1 (2).docx M1 (linked copy)"], ["Channels", u.channels.join(", ")], ["Searches", "41 a week (illustrative)"]];
  document.getElementById("view").innerHTML = `<div class="two"><div class="card"><h3>Rx Education Script v3 <span class="small">tracked spans</span></h3>
      <h4 class="small">S7 Out-of-network pharmacies (OON-A)</h4><div class="doc">${esc(s.fmtEdit ? OON_FORMAT_EDIT : oonOld)}</div>
      <div class="acts" style="margin:6px 0 14px">${s.fmtEdit ? `<span class="ok">Saved. ${who("Rule")} normalised spacing and quotes: no change in the words, no alert (test T2).</span>` : `<button class="btn sm" id="fmtEdit">Save a formatting-only edit (extra spaces)</button>`}</div>
      <h4 class="small">S4 Pricing disclaimer (PD-B)</h4><div class="doc">${s.legalEdit ? wdiff(pdOld, PD_B_FINAL) : esc(pdOld)}</div>
      <div class="acts" style="margin-top:6px">${s.legalEdit ? '<span class="ok">Saved by Tom Bexley.</span>' : `<button class="btn sm primary" id="legalEdit">Save Legal's edit: add "payment plan election"</button>`}</div></div>
    <div>${s.legalEdit ? `<div class="drift"><span>One grouped alert: the exact wording PD changed in its source</span></div>
      <div class="card" style="margin-top:10px"><details class="fold" style="margin-top:0"><summary>Every place the clause lives (${places.length}) ${who("AI")}</summary><table><tbody>${places.map(p => `<tr><th style="width:110px">${p[0]}</th><td>${esc(p[1])}</td></tr>`).join("")}</tbody></table></details>
      <h3 style="margin-top:12px">Proposed: KU-202 v2 (PD-B) ${who("AI")}</h3><div class="diff">${wdiff(u.versions[0].clause.text, PD_B_FINAL)}</div><p class="small">Against PD-A, approved for 2026. In force 1 Jan 2027 to 31 Dec 2027. Until then every channel keeps serving PD-A.</p>
      ${s.driftApproved ? `<p class="ok">Approved by Tom Bexley ${esc(s.driftApproved.on)}. Every channel switches to PD-B on 1 Jan 2027, from this one approval. <a href="desk.html?role=insurance&call=C1&asof=1%20Jan%202027">Preview the desk on 1 Jan 2027</a> · <a href="channels.html?unit=KU-202">See the channels</a></p>` : `<div class="acts">${who("Human")}<button class="btn primary" id="approveDrift">Approve once (Tom Bexley)</button></div>`}</div>` :
      `<div class="quiet">${s.fmtEdit ? "Formatting-only change: no alert. The real edit comes next." : "No change saved yet."}</div>`}
      <div class="card flat" style="margin-top:12px"><h3>Expiry, flagged the same way</h3><p class="small">KU-207 v1 (STAR-26) left service on 29 Oct 2026, 21 calendar days after CMS released the 2027 Star Ratings on 8 Oct 2026 [ST-01, R-11; Plan Finder release on the data-table date is assumed]. Searches since then get STAR-27.</p></div></div></div>`;
  const f = document.getElementById("fmtEdit"); if (f) f.onclick = () => { store.up(x => { x.fmtEdit = true; logEv(x, "KU-205", "legal", "edited source (formatting only)", "Rx Script v3 S7; normalised text unchanged; no alert"); }); draw(); };
  const l = document.getElementById("legalEdit"); if (l) l.onclick = () => { store.up(x => { x.legalEdit = true; logEv(x, "KU-202", "legal", "edited source", "Rx Script v3 S4: added payment plan election"); logEv(x, "KU-202", "AI drift check", "raised one grouped alert", "1 unit, 4 documents, " + u.channels.length + " channels"); notify(x, ["legal", "author", "owner"], "Drift: PD changed in Rx Script v3. One alert, proposed v2", "drift.html"); }); draw(); };
  const a = document.getElementById("approveDrift"); if (a) a.onclick = () => { store.up(x => { x.driftApproved = { on: PLAN.today }; logEv(x, "KU-202", "legal", "approved v2 (PD-B)", "in force 1 Jan 2027; one approval, every channel", 2); notify(x, ["author", "owner"], "Tom approved PD-B for 1 Jan 2027; every channel updates then", "channels.html?unit=KU-202"); }); draw(); };
}
draw();
</script></body></html>
