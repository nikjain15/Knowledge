<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css?v=7e811e2">
<link rel="stylesheet" href="styles.css?v=7e811e2">
<title>Renee · Lakewell Knowledge</title></head><body>
<main class="area"><div class="phead"><div><p class="eyebrow">Knowledge owner</p><h1>Renee Caldwell</h1><p>Reads what people searched for and could not find, tunes search, grants access, retires sources, and watches the clocks.</p></div><div class="right"><button class="btn sm" id="csv">Export audit CSV</button></div></div>
<div class="tabs" id="tabs"></div><div id="intro"></div><div id="view"></div></main>
<script src="data.js?v=7e811e2"></script><script src="app.js?v=7e811e2"></script>
<script>
nav("owner.html", "owner");
const TABS = [["queue", "Queues and clocks"], ["gaps", "Gap backlog"], ["tuning", "Search tuning"], ["access", "Access and sources"], ["dash", "Dashboard"]];
let tab = QS.get("tab") || "dash";
document.getElementById("csv").onclick = auditCSV;
function draw() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => `<button aria-pressed="${k === tab}" data-t="${k}">${l}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; history.replaceState(null, "", "owner.html?tab=" + tab); draw(); });
  const I = { queue: ["Everything waiting on a person, with how long it has waited.", "Each item shows who holds the next move. Overdue items turn red."],
    gaps: ["Empty searches, grouped by the AI into topics.", "Renee decides for each group: write an answer, or fix the process that causes the question."],
    tuning: ["Synonyms and a pinned answer the AI learned from the search log.", "None goes live until Renee confirms it. Try the search box after confirming."],
    access: ["Who may read which knowledge base, and which documents are sources of record.", "Only a person grants access or retires a source. Search follows the grants on every question."],
    dash: ["How search is doing this week, and what needs attention.", "Volumes are illustrative. Scope leaks must stay at 0."] }[tab];
  intro("intro", I[0], I[1]);
  ({ queue, gaps: gapb, tuning, access, dash })[tab]();
}
const V = document.getElementById.bind(document, "view");
function queue() {
  const rows = units().filter(u => ["in review", "awaiting co-sign", "changes requested"].includes(u.latest.state) && !(u.id === "KU-202" && u.versions[0].state === "approved" && !S().legalEdit));
  const holder = u => u.latest.state === "awaiting co-sign" ? secondSigner(u) : u.latest.state === "changes requested" ? "author" : u.approver;
  /* Decision 6: reassign moves the item to the backup, notifies them, logs it and restarts the clock; a late backup goes to Renee, who decides */
  setTimeout(() => document.querySelectorAll("[data-re]").forEach(b => b.onclick = () => { const [id, h] = b.dataset.re.split("|"); store.up(x => { x.reassigned = x.reassigned || {}; const prev = x.reassigned[id];
    if (!prev) { x.reassigned[id] = { to: BACKUP[h], from: h, on: PLAN.today, level: 1 }; logEv(x, id, "owner", "reassigned", `3 working days late; moved from ${ROLES[h].person} to ${BACKUP[h]}; ${BACKUP[h]} and the function head notified; clock restarted`); notify(x, [h, "owner"], `${id} moved from ${ROLES[h].person} to ${BACKUP[h]}; ${BACKUP[h]} notified`, "owner.html?tab=queue"); }
    else { x.reassigned[id] = Object.assign(prev, { to: "Renee Caldwell (decides)", on: PLAN.today, level: 2 }); logEv(x, id, "owner", "escalated to Renee", `${prev.to} also 3 working days late; Renee decides`); notify(x, "owner", `${id}: backup also late. You decide.`, "owner.html?tab=queue"); } }); draw(); }), 0);
  setTimeout(() => { const sim = document.getElementById("simLate"); if (sim) sim.onclick = () => { store.up(x => Object.values(x.reassigned || {}).forEach(r => { if (r.level === 1) r.on = "27 Oct 2026"; })); draw(); }; }, 0);
  V().innerHTML = `<div class="card"><h3>Everything waiting, by owner of the next move</h3><table><thead><tr><th>Unit</th><th>Waiting on</th><th>State</th><th>Clock</th><th></th></tr></thead><tbody>${rows.map(u => { const h = holder(u), c = clockOf(u), re = (S().reassigned || {})[u.id], st = slaStage(c.since, c.kind === "author" ? "owner" : c.kind).stage;
      const waiting = re ? re.to : ROLES[h].person;
      const act = re && re.level === 2 ? `<a class="btn sm primary" href="review.html?as=owner&u=${u.id}">Decide</a>` : st === "reassign" && h !== "author" ? `<button class="btn sm danger" data-re="${u.id}|${h}">${re ? "Escalate to Renee" : "Reassign"}</button>` : "";
      return `<tr><td><b class="mono">${u.id}</b> ${esc(u.title)}${u.synthetic ? ' <span class="small">(sample)</span>' : ""}</td><td>${esc(waiting)}${re ? `<div class="small">moved from ${esc(ROLES[re.from].person)} ${esc(re.on)}</div>` : ""}</td><td>${statePill(u.latest.state)}</td><td>${slaPill(c.since, c.kind === "author" ? "owner" : c.kind)}${c.e2eMissed ? ` <span class="pill bad">end to end ${c.e2e.used} of ${c.e2e.lim}</span>` : ""}</td><td>${act} <a href="${h === "author" ? "author.html?tab=fix&u=" + u.id : "review.html?as=" + h + "&u=" + u.id}">Open</a></td></tr>`; }).join("") || '<tr><td colspan="5">Nothing waiting.</td></tr>'}</tbody></table>
    <details class="fold"${rows.some(u => slaStage(clockOf(u).since, clockOf(u).kind).late >= 1) ? "" : ""}><summary>How the clocks escalate (6 rules)</summary><table class="small" style="margin-top:6px"><thead><tr><th>Stage</th><th>When</th><th>What happens</th></tr></thead><tbody><tr><td>Reminder</td><td>Due date</td><td>Reviewer notified</td></tr><tr><td>Escalated</td><td>1 working day late</td><td>Red flag; Renee notified</td></tr><tr><td>Reassign</td><td>3 working days late</td><td>Item moves to the backup of the same type (never the proposer), who is notified; clock restarts</td></tr><tr><td>Renee decides</td><td>Backup also 3 working days late</td><td>Renee approves, sends back or reassigns herself</td></tr><tr><td>End to end</td><td>Over 6 working days, two signers</td><td>Escalated to Renee even if the current signer is in time</td></tr><tr><td>Day 0</td><td>Live wording wrong (drift)</td><td>Escalated at once</td></tr></tbody></table>
    <p class="small" style="margin-top:6px">Service levels, working days, weekends and US federal holidays skipped (J, D68; compared with a life-sciences vendor benchmark of 7.6 days per review [V-68] and 21 to 24 days to approval [S-47]): Legal ${SLA.legal}, clinical ${SLA.clinical}, medical director ${SLA.medical}, end to end for two signers ${SLA.endToEnd}, owner ${SLA.owner}, gap ${SLA.gap}, drift ${SLA.drift}, translator ${SLA.translator}. CMS's own 45-day review and 5-day File and Use clocks (AP-01) are separate.</p></details><p class="small">${Object.values(S().reassigned || {}).some(r => r.level === 1) ? ' <button class="btn sm" id="simLate">Demo: the backup is now 3 working days late</button>' : ""}</p></div>
    <div class="card" style="margin-top:12px"><h3>Hand-offs today</h3>${(S().notes || []).length ? `<ul class="log">${(S().notes || []).slice().reverse().slice(0, 12).map(n => `<li><span class="t">${n.t} to ${esc(ROLES[n.to].person.split(" ")[0])}</span><span>${esc(n.text)}</span></li>`).join("")}</ul>` : '<p class="small">None yet.</p>'}</div>`;
}
function gapb() {
  const s = S(), G = gaps(), TR = s.testRows || [];
  V().innerHTML = `${TR.length ? `<div class="card"><h3>Proposed test rows from feedback (${TR.length})</h3><p class="small">Marked "wrong" on Prove it; the label owner turns each into a golden or probe row (D120).</p><ul class="small">${TR.map(t => `<li>"${esc(t.q)}": ${esc(t.note || "")} · ${esc(t.on)}</li>`).join("")}</ul></div>` : ""}`+ `<p class="small">${who("AI")} clusters every question that came back empty. ${who("Human")} Renee decides: write an answer, or fix the process that causes the question.</p><div class="stack">${G.map(g => `<div class="card"><div class="acts"><h3 style="margin:0">${esc(g.name)}</h3><span class="pill design">${g.n} searches · ${g.items.length} question${g.items.length > 1 ? "s" : ""}</span>${slaPill(g.since, "gap")}${g.decision ? statePill(g.decision === "write" ? "in review" : "approved").replace(/>.*</, ">" + (g.decision === "write" ? "write an answer" : "process fix") + "<") : ""}</div>
    <div class="small" style="margin:6px 0">${g.items.map(i => esc(i.q)).join(" · ")}</div><div>Proposed unit: <b>${esc(g.proposal || "")}</b>${g.processFix ? `<div class="dup" style="margin-top:6px">${who("AI")} reads this as a process problem: ${esc(g.processFix)}</div>` : ""}</div>
    <div class="acts" style="margin-top:8px"><button class="btn sm ${g.decision === "write" ? "on" : ""}" data-d="${esc(g.name)}|write">Write an answer</button><button class="btn sm ${g.decision === "process" ? "on" : ""}" data-d="${esc(g.name)}|process">Fix the process</button>${g.written && !(S().approved || {})["KU-230"] ? `<a class="btn sm primary" href="review.html?as=owner&u=KU-230">Approve Priya's draft</a>` : ""}</div></div>`).join("")}</div>`;
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const [c, d] = b.dataset.d.split("|"); store.up(x => { x.gapDecision = x.gapDecision || {}; x.gapDecision[c] = d; logEv(x, "GAP", "owner", d === "write" ? "decided: write an answer" : "decided: fix the process", c); notify(x, "author", d === "write" ? `Renee asks for a unit: ${c}` : `Renee sent "${c}" to a process owner; no unit needed`, "author.html?tab=gaps&c=" + encodeURIComponent(c)); }); draw(); });
}
function tuning() {
  const s = S();
  V().innerHTML = `<div class="two"><div class="card"><h3>Synonyms learned from the search log ${who("AI")}</h3><p class="small">Proposed from what advocates actually typed. Search uses one only after Renee confirms it.</p>
    <table><thead><tr><th>Typed</th><th>Means</th><th>Seen</th><th></th></tr></thead><tbody>${SYNONYM_SUGGESTIONS.map(x => `<tr><td><b>${esc(x.from)}</b><div class="small">${esc(x.example)}</div></td><td>${esc(x.to)}</td><td>${x.seen}</td><td>${(s.synonyms || {})[x.from] ? '<span class="ok">live</span>' : `<button class="btn sm" data-syn="${x.from}">Confirm</button>`}</td></tr>`).join("")}</tbody></table>
    <details class="fold"><summary>Built-in synonyms (${Object.keys(SYNONYMS).length})</summary><p class="small">${Object.entries(SYNONYMS).map(([a, b]) => `${a} = ${b}`).join(" · ")}</p></details></div>
    <div class="card"><h3>Pinned answer for a top question ${who("AI")}</h3>${PIN_SUGGESTIONS.map(p => `<p><b>"${esc(p.q)}"</b> asked ${p.seen} times this week. ${esc(p.why)}.</p><p>Pin to <span class="mono">${p.unit}</span> ${esc((unit(p.unit) || {}).title || "")}</p>${(s.pins || {})[p.q] ? '<p class="ok">Pinned.</p>' : `<button class="btn sm primary" data-pin="${esc(p.q)}">Confirm the pin</button>`}`).join("")}
    <p class="small">A pin still obeys every rule: only an approved, in-force unit the asker may read is served.</p>
    <h3 style="margin-top:14px">Try it</h3><div class="searchbar"><input type="text" id="tq" value="what do i read before quoting a price"><button class="btn" id="tgo">Search as Luis</button></div><div id="tout" class="small" style="margin-top:8px"></div></div></div>`;
  document.querySelectorAll("[data-syn]").forEach(b => b.onclick = () => { store.up(x => { x.synonyms = x.synonyms || {}; x.synonyms[b.dataset.syn] = true; logEv(x, "SEARCH", "owner", "confirmed synonym", b.dataset.syn); }); draw(); });
  document.querySelectorAll("[data-pin]").forEach(b => b.onclick = () => { store.up(x => { x.pins = x.pins || {}; x.pins[b.dataset.pin] = PIN_SUGGESTIONS[0].unit; logEv(x, PIN_SUGGESTIONS[0].unit, "owner", "pinned answer", b.dataset.pin); }); draw(); });
  document.getElementById("tgo").onclick = () => { const r = answer(document.getElementById("tq").value, { role: "pharmacy" }); document.getElementById("tout").innerHTML = r.kind === "answer" ? `<span class="ok">${r.unit.id} ${esc(r.unit.title)}</span>` : `<span class="no">No approved answer</span> ${r.unit === undefined ? "" : ""}`; };
}
function access() {
  const s = S(), roles = ["insurance", "pharmacy", "member"];
  V().innerHTML = `<div class="two"><div class="card"><h3>Who reads which base ${who("Human")}</h3><p class="small">Only a person grants a role access. Search reads these grants on every question (D31). The golden set was labelled on the default grants; a change here asks for re-labelling.</p>
    <table><thead><tr><th>Role</th>${KBS.map(k => `<th>${k}</th>`).join("")}</tr></thead><tbody>${roles.map(r => `<tr><td>${esc(ROLES[r].label)}</td>${KBS.map(k => { const on = readsOf(r).includes(k); return `<td><button class="btn sm ${on ? "on" : ""}" data-a="${r}|${k}">${on ? "reads" : "no"}</button></td>`; }).join("")}</tr>`).join("")}</tbody></table>
    ${s.access ? `<p class="dup" style="margin-top:8px">Grants differ from the labelled policy. Re-label G9 and G19 before the next release run.</p><button class="btn sm" id="resetAccess">Restore the labelled grants</button>` : ""}</div>
    <div class="card"><h3>Sources of record ${who("Human")}</h3><table><thead><tr><th>Document</th><th>Owner</th><th>State</th><th></th></tr></thead><tbody>${DOCS.map(d => { const ret = (s.retiredDocs || {})[d.id]; return `<tr><td><b>${esc(d.title)}</b><div class="small">${esc(d.tool || "")} ${d.messy ? "· stale 2025 line flagged" : ""}</div></td><td>${esc(d.owner)}</td><td>${statePill(ret ? "retired" : d.state === "current" ? "approved" : d.state)}</td><td>${d.legacy && !ret ? `<button class="btn sm danger" data-r="${d.id}">Retire</button>` : ""}</td></tr>`; }).join("")}</tbody></table>
    <p class="small">Retiring a source of record retires every unit taken from it and removes it from the old tools' index.</p></div></div>`;
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { const [r, k] = b.dataset.a.split("|"); store.up(x => { x.access = x.access || {}; const cur = (x.access[r] || ROLES[r].reads).slice(); const i = cur.indexOf(k); i >= 0 ? cur.splice(i, 1) : cur.push(k); x.access[r] = cur; logEv(x, "ACCESS", "owner", i >= 0 ? "revoked base" : "granted base", `${ROLES[r].label}: ${k}`); }); draw(); });
  const ra = document.getElementById("resetAccess"); if (ra) ra.onclick = () => { store.up(x => { delete x.access; logEv(x, "ACCESS", "owner", "restored labelled grants", ""); }); draw(); };
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { store.up(x => { x.retiredDocs = x.retiredDocs || {}; x.retiredDocs[b.dataset.r] = PLAN.today; logEv(x, b.dataset.r, "owner", "retired source of record", doc(b.dataset.r).title); notify(x, ["author", "legal"], `Renee retired ${doc(b.dataset.r).title} as a source of record`, "owner.html?tab=access"); }); draw(); });
}
function bars(vals, labels, max, fmt) { return `<svg viewBox="0 0 ${vals.length * 60} 140" style="width:100%;max-width:420px">${vals.map((v, i) => { const h = Math.round(v / max * 100); return `<rect x="${i * 60 + 12}" y="${110 - h}" width="36" height="${h}" rx="4" fill="#72992e"></rect><text x="${i * 60 + 30}" y="${104 - h}" font-size="11" text-anchor="middle" fill="#182218">${fmt ? fmt(v) : v}</text><text x="${i * 60 + 30}" y="128" font-size="10" text-anchor="middle" fill="#5b6660">${labels[i]}</text>`; }).join("")}</svg>`; }
function dash() {
  const s = S(), G = gaps(), all = units(), live = all.filter(u => u.current).length, waiting = all.filter(u => ["in review", "awaiting co-sign", "changes requested"].includes(u.latest.state)).length;
  const top = SEARCH_LOG.slice().sort((a, b) => b.n - a.n).slice(0, 8);
  const attn = [];
  all.filter(u => ["in review", "awaiting co-sign"].includes(u.latest.state) && slaStage(clockOf(u).since, clockOf(u).kind).late >= 1).forEach(u => attn.push(`${u.id} ${u.title}: overdue with ${ROLES[u.approver].person}`));
  G.filter(g => ageDays(g.since) > SLA.gap && !g.decision).forEach(g => attn.push(`Gap "${g.name}": ${g.n} searches, no decision for ${ageDays(g.since)} days`));
  if ((s.ingested || {})["DOC-SD09"]) attn.push("FINAL_v1 (2).docx carries a stale 2025 date: retire or assign an owner");
  if (!s.driftApproved && s.legalEdit) attn.push("Drift alert on PD waits for Tom");
  attn.push("Spanish PD draft waits for a qualified translator (5-day clock)");
  V().innerHTML = `<div class="kpis"><div class="kpi"><div class="n">${VOLUME.searches.slice(-1)[0].toLocaleString()}</div><div class="l">searches last week</div></div><div class="kpi"><div class="n">${VOLUME.answerRate.slice(-1)[0]}%</div><div class="l">answered from an approved unit</div></div><div class="kpi"><div class="n">${live}</div><div class="l">units in force now</div></div><div class="kpi"><div class="n">${waiting}</div><div class="l">waiting on a person</div></div><div class="kpi"><div class="n">${G.reduce((a, g) => a + g.n, 0)}</div><div class="l">empty searches, 7 days</div></div><div class="kpi"><div class="n">${VOLUME.medianApprovalDays}d</div><div class="l">median draft to approval</div></div><div class="kpi"><div class="n">0</div><div class="l">scope leaks (must be 0)</div></div></div>
    <div class="two"><div class="card"><h3>Weekly searches</h3><p class="small">Rising with the Annual Enrollment Period.</p>${bars(VOLUME.searches, VOLUME.weeks, 3200, v => (v / 1000).toFixed(1) + "k")}</div>
    <div class="card"><h3>Answered from an approved unit</h3>${bars(VOLUME.answerRate, VOLUME.weeks, 100, v => v + "%")}</div></div>
    <div class="two" style="margin-top:12px"><div class="card"><h3>By channel, last week</h3><table><thead><tr><th>Channel</th><th>Searches</th><th>Answered</th></tr></thead><tbody>${VOLUME.byChannel.map(c => `<tr><td>${c[0]}</td><td><div class="barcell"><i style="width:${c[1] / 20}px"></i><span>${c[1]}</span></div></td><td>${c[2]}%</td></tr>`).join("")}</tbody></table></div>
    <div class="card"><h3>Needs attention</h3><ul>${attn.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div></div>
    <div class="card" style="margin-top:12px"><h3>Top questions this week</h3><table><thead><tr><th>Question</th><th>Role</th><th>Times</th><th>Result now</th></tr></thead><tbody>${top.map(l => { const r = answer(l.q, { role: l.role }); return `<tr><td>${esc(l.q)}</td><td>${esc(ROLES[l.role].label)}</td><td>${l.n}</td><td>${r.kind === "answer" ? `<span class="ok">${r.unit.id}</span>` : `<span class="no">${r.kind === "scope" ? "outside scope" : "no approved answer"}</span>`}</td></tr>`; }).join("")}</tbody></table>
    <p class="small" style="margin-top:6px">All volumes are fictional and illustrative.</p></div>`;
}
draw();
</script></body></html>
