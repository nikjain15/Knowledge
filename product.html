nav("product.html", "");

const ini = n => n.split(" ").map(x => x[0]).join("");

const start = e => { e.preventDefault(); store.reset(); location.href = "day.html?mode=today"; };
document.getElementById("start").onclick = start; document.getElementById("start2").onclick = start;
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => window.open(ROLES[b.dataset.tab].home, "lw-" + b.dataset.tab));
