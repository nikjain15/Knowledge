<title>Trade-offs · Lakewell Knowledge</title>
<style>
.tos{display:grid;gap:10px;margin-top:8px}
.to{border:1px solid #e4e6dc;border-radius:14px;background:#fff;padding:14px 16px;display:grid;grid-template-columns:32px 1.3fr 1fr 1.2fr 1.2fr;gap:8px 18px;align-items:start;opacity:0;transform:translateY(8px);animation:toin .5s ease forwards}
.to .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:800;font-size:13px;background:#2b2f27;color:#fff}
.to h3{margin:0;font-family:Manrope,sans-serif;font-weight:800;font-size:15.5px;line-height:1.35}
.to dl{margin:0}.to dt{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.to dd{margin:0;font-size:13.5px;line-height:1.45}
.to .cost dd{color:#8a4b12}.to .fix,.to .fut{border:0;padding:0;background:none}
.to dt{display:none}
.tohead{display:grid;grid-template-columns:32px 1.3fr 1fr 1.2fr 1.2fr;gap:8px 18px;padding:0 17px;margin-top:16px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:900px){.tohead{display:none}.to dt{display:block}}
.to .flip{grid-column:2 / -1;font-size:12.5px;color:var(--muted);border-top:1px dashed #e2e3db;padding-top:7px}
@keyframes toin{to{opacity:1;transform:none}}
@media (max-width:900px){.to{grid-template-columns:32px 1fr}.to .flip{grid-column:1 / -1}.to dl{grid-column:2}}
@media (prefers-reduced-motion:reduce){.to{animation:none;opacity:1;transform:none}}
.to h3 .alt{display:block;margin-top:5px;font-family:Mulish,sans-serif;font-weight:600;font-size:12.5px;line-height:1.4;color:var(--muted)}
</style></head><body>
<main class="area" style="max-width:1280px">

<script>
/* The trade-offs we made, what each costs and how we handle it (PRD section 17; D23, D31, D53, D78, S5.3, S8; Prove it counts). */
nav("choices.html", "", { demo: true });
document.getElementById("stepper").innerHTML = storyStepper(5);
const TO = [
  ["No approved answer means 'not yet', never a guess", "Let the AI answer from whatever it finds", "At launch, 107 of 253 test questions get 'not yet' instead of an answer", "Every one goes on Priya's list, most-asked first: 33 dental questions became one answer to write; coverage reported weekly", "The AI drafts the missing answer from approved sources for Priya to approve, so gaps close in days, not weeks"],
  ["Staff first, members last", "Start with member chat, where most questions come from", "Members get the benefit last", "Advocates prove the answers first; members then get the same approved answers, with stricter rules", "Member chat widens step by step as each measured gate holds: a small group, then more, then everyone"],
  ["Answers stored as short topics, with Legal's sentences locked inside", "Chop documents into fixed-size chunks", "Every document must be split into topics, and Legal's sentences marked, before it can be searched", "The AI does the split and marks the sentences; Priya only accepts; a change re-opens only the topic it touches", "The AI learns from Priya's edits, and templates for common document types cut the set-up time"],
  ["The AI never merges duplicates on its own", "Auto-merge copies that look nearly the same", "A person rules on each conflict, and old copies stay until they do", "Word-by-word differences make each ruling quick; one ruling retires every copy; late reviews move to a backup", "Once its proposals are proven right, low-risk duplicates that are not legal wording merge automatically, with an undo; legal wording always needs a person"],
  ["Strict rules for personal and cost questions", "Let the AI judge each question on its own", "Some ordinary questions are refused by mistake: 4 of 253 in testing (3.3%), such as 'How do I appeal a denied exception?'", "Up to 10% allowed at launch, target 2%; every mistake becomes a new test", "A trained classifier replaces the word list, and verified sign-in lets members get their own answers instead of a hand-off"],
  ["The user's role is checked on every question", "Check it once, at sign-in", "Every search makes one extra check, so it is slightly slower", "The delay is measured in the pilot", "Roles are cached briefly once the identity system can revoke access instantly"]
];
document.getElementById("stage").innerHTML = `<p class="eyebrow">Trade-offs</p>
  <h2 class="hl">Six times we chose safety over speed.</h2>
  
  <div class="tohead"><span></span><span>We chose</span><span>The cost today</span><span>How we keep it small now</span><span>How later builds fix it</span></div><div class="tos">${TO.map((t, i) => `<div class="to" style="animation-delay:${(i * 0.16).toFixed(2)}s"><span class="n">${i + 1}</span><h3>${esc(t[0])}<small class="alt">instead of: ${esc(t[1].replace(/^./, c => c.toLowerCase()))}</small></h3><dl class="cost"><dt>The cost today</dt><dd>${esc(t[2])}</dd></dl><dl class="fix"><dt>How we keep it small now</dt><dd>${esc(t[3])}</dd></dl><dl class="fut"><dt>How later builds fix it</dt><dd>${esc(t[4])}</dd></dl></div>`).join("")}</div>
  <div class="foot" style="margin-top:18px"><a class="btn" href="prd.html#decisions">All decisions in the PRD</a><a class="btn primary" href="prd.html">Next: the PRD →</a></div>`;
document.querySelector("main").insertAdjacentHTML("beforeend", `<p class="small" style="margin-top:14px">From the PRD, section 17, and the Prove it results.</p>`);
</script></body></html>
