<title>Trade-offs · Lakewell Knowledge</title>
<style>
.tos{display:grid;gap:12px;margin-top:16px}
.to{border:1px solid #e4e6dc;border-radius:14px;background:#fff;padding:14px 16px;display:grid;grid-template-columns:32px 1.2fr 1fr 1fr 1.2fr;gap:8px 18px;align-items:start;opacity:0;transform:translateY(8px);animation:toin .5s ease forwards}
.to .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:800;font-size:13px;background:#2b2f27;color:#fff}
.to h3{margin:0;font-family:Manrope,sans-serif;font-weight:800;font-size:15.5px;line-height:1.35}
.to dl{margin:0}.to dt{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.to dd{margin:0;font-size:13.5px;line-height:1.45}
.to .cost dd{color:#8a4b12}.to .fix{border-left:3px solid #2b2f27;padding-left:10px}
.to .flip{grid-column:2 / -1;font-size:12.5px;color:var(--muted);border-top:1px dashed #e2e3db;padding-top:7px}

@media (max-width:900px){.to{grid-template-columns:32px 1fr}.to .flip{grid-column:1 / -1}.to dl{grid-column:2}}

<main class="area" style="max-width:1280px">
<div id="stepper"></div>
<div class="hhead"><h1>Trade-offs</h1></div>
<div class="card howcard" id="stage"></div>
</main>
<script src="data.js?v=159ad3d"></script><script src="app.js?v=159ad3d"></script><script src="story-shared.js?v=159ad3d"></script>
<script>
/* The trade-offs we made, what each costs and how we handle it (PRD section 17; D23, D31, D53, D78, S5.3, S8; Prove it counts). */
nav("choices.html", "", { demo: true });
document.getElementById("stepper").innerHTML = storyStepper(5);
const TO = [
  ["We store answers as short topics, with Legal's sentences locked inside", "Chopping documents into fixed-size chunks, the common search approach", "Every document has to be split into topics, and Legal's sentences marked, before anyone can search it", "The AI does the split and marks the sentences; Priya only accepts. When Legal changes one sentence, only the topic it sits in goes back for approval, not the whole document"],
  ["The AI never merges duplicates on its own", "Auto-merging copies that look nearly the same", "A person has to rule on each conflict, and until they do, the old copies stay in place", "The AI shows the word-by-word difference, so a ruling takes minutes; one ruling retires every copy; a late review moves to a backup reviewer"],
  ["No approved answer means 'not yet', never a guess", "Letting the AI answer from whatever it finds", "At launch, 107 of 253 test questions get 'not yet' instead of an answer", "Every one goes on Priya's list, most-asked first: 33 dental questions became one answer to write. Coverage is reported every week"],
  ["Strict rules for personal and cost questions", "Letting the AI judge each question on its own", "Some ordinary questions are refused by mistake: 4 of 253 in testing (3.3%), such as 'How do I appeal a denied exception?'", "Allowed up to 10% at launch, target 2%; every mistake becomes a new test; a trained classifier replaces the word list in production"],
  ["Staff first, members last", "Starting with member chat, where most questions come from", "Members wait until the last phase to get the benefit", "Advocates prove the answers first; members then get the same approved answers, with stricter rules because no person checks first"],
  ["The user's role is checked on every question", "Checking it once, at sign-in", "Every search makes one extra check, so it is slightly slower", "The delay is measured in the pilot, and the check is relaxed only if it slows calls down"]
];
document.getElementById("stage").innerHTML = `<p class="eyebrow">Trade-offs</p>
  <h2 class="hl">Six times we chose safety over speed. Here is what each choice costs, and how we keep the cost small.</h2>
  
  <div class="tos">${TO.map((t, i) => `<div class="to" style="animation-delay:${(i * 0.16).toFixed(2)}s"><span class="n">${i + 1}</span><h3>${esc(t[0])}${i === 0 ? ` <span class="thr-pill" style="background:#f1f1ec;color:#2b2f27">Key trade-off</span>` : ""}</h3><dl><dt>We did not</dt><dd>${esc(t[1])}</dd></dl><dl class="cost"><dt>The cost</dt><dd>${esc(t[2])}</dd></dl><dl class="fix"><dt>How we keep it small</dt><dd>${esc(t[3])}</dd></dl></div>`).join("")}</div>
  <div class="foot" style="margin-top:18px"><a class="btn" href="prd.html#decisions">All decisions in the PRD</a><a class="btn primary" href="prd.html">Next: the PRD →</a></div>`;
document.querySelector("main").insertAdjacentHTML("beforeend", `<p class="small" style="margin-top:14px">From the PRD, section 17, and the Prove it results.</p>`);
</script></body></html>
