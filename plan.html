<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Roadmap · Lakewell Knowledge</title>
<style>
.rule3{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 18px}.rule3 span{font-family:Manrope,sans-serif;font-weight:800;font-size:14px;padding:7px 12px;border-radius:99px;background:#f1f1ec;color:#2b2f27;border:1px solid #e2e3db}.rule3 i{font-style:normal;color:var(--muted)}
.path{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
.path:before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:#e2e3db}
.rp{position:relative;display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start;opacity:0;transform:translateY(8px);animation:stin .5s ease forwards}
.rp .dot{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:800;font-size:15px;background:#fff;border:2px solid #cfd1c7;color:#2b2f27}
.rp.first .dot{background:#2b2f27;border-color:#2b2f27;color:#fff}
.rp .box{border:1px solid #e4e6dc;border-radius:14px;background:#fff;padding:12px 14px;display:grid;grid-template-columns:1.1fr 1.4fr 1fr 1.4fr;gap:10px 18px;align-items:start}
.rp.first .box{border-color:#2b2f27}
.rp h3{margin:0;font-family:Manrope,sans-serif;font-weight:800;font-size:16px}.rp h3 small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:2px}
.rp dl{margin:0}.rp dt{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.rp dd{margin:0;font-size:13.5px;line-height:1.45}
@keyframes stin{to{opacity:1;transform:none}}
.side2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.side2 div{border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5}.side2 .pilot{background:#f6f6f2;border:1px solid #e2e3db}.side2 .stop{background:#fdf4ec;border:1px solid #f0c9a8}.side2 b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
@media (max-width:900px){.rp .box{grid-template-columns:1fr 1fr}.side2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rp{animation:none;opacity:1;transform:none}}
</style></head><body>
<main class="area" style="max-width:1280px">
<div id="stepper"></div>
<div class="hhead"><h1>Roadmap</h1></div>
<div class="card howcard" id="stage"></div>
</main>
<script src="data.js?v=4abd055"></script><script src="app.js?v=4abd055"></script><script src="story-shared.js?v=4abd055"></script>
<script>
/* How we build it, in order (PRD section 14, strategy S10, D78, D180). Plain words; no durations on screen (they are placeholders). */
nav("plan.html", "", { demo: true });
document.getElementById("stepper").innerHTML = storyStepper(4);
const STEPS_R = [
  ["Prove it works", "The core on one slice of pharmacy content: topics, exact wording, approval, search over approved answers, the gap list, drift alerts", "Priya, Tom and Renee, the people who write and approve", "Every safety rule passes on the test sets, including the sealed one"],
  ["Govern one knowledge base", "The Pharmacy knowledge base, run end to end: every script and disclaimer approved once, Legal's words marked, Spanish where required", "Authors and approvers", "No wrong merges, drift alerts are accurate, and the monitoring plan is signed"],
  ["Search for advocates", "Dana and Luis search approved answers only, scoped to their role; unanswered questions go to Priya's list", "Advocates at the desk", "Four weeks with nobody seeing content outside their role, and the right answer in the top five for most questions"],
  ["AI for advocates", "Agent Assist reads the same approved answers, with Legal's words inserted exactly", "Advocates, with AI beside them", "Almost every claim is backed by the cited answer, and Legal's words are never changed"],
  ["Members in chat", "June gets answers in the member chat; member-facing answers approved separately; AI use disclosed", "Members, with no person checking first", "The stricter member rules pass and the disclosure wording is approved"],
  ["Texts and the website", "Reminder texts and website pages read the same answers; search analytics show what people ask that nobody has answered", "Every channel", "The same checks keep running every week, across every channel"]
];
document.getElementById("stage").innerHTML = `<p class="eyebrow">How we build it</p>
  <h2 class="hl">We fix the knowledge first, then let people search it, then let AI use it, and only then show it to members.</h2>
  <p class="was1"><b>Why this order:</b> each step puts less of a person between the answer and the member, so each one has to prove itself before the next starts.</p>
  <div class="rule3"><span>Knowledge first</span><i>→</i><span>Search for staff</span><i>→</i><span>AI for staff</span><i>→</i><span>Members</span><i>→</i><span>Every channel</span></div>
  <ol class="path">${STEPS_R.map((r, i) => `<li class="rp${i === 0 ? " first" : ""}" style="animation-delay:${(i * 0.18).toFixed(2)}s"><span class="dot">${i + 1}</span><div class="box"><h3><small>Step ${i + 1}${i === 0 ? " · the pilot" : ""}</small>${esc(r[0])}</h3><dl><dt>We build</dt><dd>${esc(r[1])}</dd></dl><dl><dt>Who uses it</dt><dd>${esc(r[2])}</dd></dl><dl><dt>Ready for the next step when</dt><dd>${esc(r[3])}</dd></dl></div></li>`).join("")}</ol>
  <div class="side2"><div class="pilot"><b>Where search goes</b>Step 3, straight after the first knowledge base is governed. Search runs only over approved answers, so it cannot start before them.</div><div class="stop"><b>Stop rule</b>If anyone sees content outside their role, or Legal's words change, that channel stops serving at once. It restarts only after the fix ships with a new test and the signers agree.</div></div>
  <div class="foot" style="margin-top:18px"><span></span><a class="btn primary" href="choices.html">Next: Trade-offs →</a></div>`;
document.querySelector("main").insertAdjacentHTML("beforeend", `<p class="small" style="margin-top:14px">From the PRD, section 14. Timings are left out on purpose: they are placeholders until the pilot measures them.</p>`);
</script></body></html>
