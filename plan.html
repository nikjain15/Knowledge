<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css?v=e4c4ad2">
<link rel="stylesheet" href="styles.css?v=e4c4ad2"><link rel="stylesheet" href="story.css?v=e4c4ad2">
<title>Roadmap · Lakewell Knowledge</title>
<style>
.rule3{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 18px}.rule3 span{font-family:Manrope,sans-serif;font-weight:800;font-size:14px;padding:7px 12px;border-radius:99px;background:#f1f1ec;color:#2b2f27;border:1px solid #e2e3db}.rule3 i{font-style:normal;color:var(--muted)}
.path{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
.path:before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:#e2e3db}
.rp{position:relative;display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start;opacity:0;transform:translateY(8px);animation:stin .5s ease forwards}
.rp .dot{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:800;font-size:15px;background:#fff;border:2px solid #cfd1c7;color:#2b2f27}
.rp.first .dot{background:#2b2f27;border-color:#2b2f27;color:#fff}
.rp .box{border:1px solid #e4e6dc;border-radius:14px;background:#fff;padding:12px 14px;display:grid;grid-template-columns:1.1fr 1.4fr 1fr 1.4fr;gap:10px 18px;align-items:start}
.rp.first .box{border-color:#2b2f27}
.rp h3{margin:0;font-family:Manrope,sans-serif;font-weight:800;font-size:16px}.rp h3 small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:2px}
.rp dl{margin:0}.rp dt{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.rp dd{margin:0;font-size:13.5px;line-height:1.45}
@keyframes stin{to{opacity:1;transform:none}}
.side2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.side2 div{border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5}.side2 .pilot{background:#f6f6f2;border:1px solid #e2e3db}.side2 .stop{background:#fdf4ec;border:1px solid #f0c9a8}.side2 b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
@media (max-width:900px){.rp .box{grid-template-columns:1fr 1fr}.side2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rp{animation:none;opacity:1;transform:none}}
.box2{border:1px solid #e4e6dc;border-radius:14px;background:#fff;padding:14px 16px;display:grid;grid-template-columns:1fr 1.3fr 1.2fr;gap:12px 22px;align-items:start}
.ph-h small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}.ph-h h3{margin:2px 0 4px;font-family:Manrope,sans-serif;font-weight:800;font-size:17px}.ph-h p{margin:0;font-size:14px;color:#2b2f27}
.ph-do{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}.ph-ok{background:#f6f6f2;border-radius:10px;padding:8px 12px;display:grid;gap:3px;font-size:13.5px}.ph-ok b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.ph-ok span{color:#2b4a12}
@media (max-width:900px){.box2{grid-template-columns:1fr}}
.rp{opacity:1;transform:none;animation:none;transition:opacity .45s ease,transform .45s ease}.rp.later{display:none}
.rp:not(.later){animation:stin .5s ease}
.ph-x{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1.5fr;gap:8px 22px;border-top:1px dashed #e2e3db;padding-top:8px;font-size:13px;color:#3b3f36}.ph-x b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
@media (max-width:900px){.ph-x{grid-template-columns:1fr}}
.ph-jobs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.ph-jobs span{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid #cfd1c7;color:#2b2f27;background:#fff}.ph-jobs .pre{color:var(--muted)}
.tl{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:18px 0 16px}
.tl-line{position:absolute;left:8.3%;right:8.3%;top:19px;height:3px;background:#e2e3db;border-radius:3px}.tl-line i{display:block;height:100%;width:0;background:#2b2f27;border-radius:3px;transition:width .5s ease}
.tl-n{position:relative;z-index:1;font:inherit;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0}
.tl-d{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:800;background:#fff;border:2px solid #cfd1c7;color:#6b6f66;transition:all .3s}
.tl-t{font-size:12.5px;font-weight:700;color:#6b6f66;text-align:center;line-height:1.3}
.tl-n.done .tl-d{background:#2b2f27;border-color:#2b2f27;color:#fff}.tl-n.on .tl-d{background:#fff;border-color:#2b2f27;color:#2b2f27;box-shadow:0 0 0 4px #e9e9e2}.tl-n.on .tl-t,.tl-n.done .tl-t{color:#2b2f27}
.phcard{border:1px solid #e4e6dc;border-radius:16px;background:#fff;padding:18px 20px}.phcard.in{animation:stin .45s ease}
.pc-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid #eef0e8;padding-bottom:12px;margin-bottom:14px}.pc-top small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}.pc-top h3{margin:2px 0 4px;font-family:Manrope,sans-serif;font-weight:800;font-size:22px}.pc-top p{margin:0;font-size:15px}
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pc-b{border-radius:12px;background:#f8f8f5;padding:12px 14px;font-size:14px;line-height:1.5}.pc-b b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.pc-b ul{margin:0;padding-left:18px}.pc-b p{margin:0}
.pc-b.ok ul.tk{list-style:none;padding:0}.pc-b.ok li:before{content:"✓ ";font-weight:800;color:#2b4a12}.pc-b.risk{background:#fdf6ee}
@media (max-width:900px){.pc-grid{grid-template-columns:1fr}.tl-t{font-size:10.5px}.pc-top{flex-direction:column}}
.pc-fr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid #eef0e8;font-size:13px}.pc-fr b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}.pc-fr a{padding:3px 9px;border-radius:99px;border:1px solid #cfd1c7;color:#2b2f27;text-decoration:none;font-weight:700;font-size:12px}.pc-fr a:hover{border-color:#2b2f27}.pc-fr span{color:var(--muted);font-size:12px}
</style></head><body>
<main class="area" style="max-width:1280px">
<div id="stepper"></div>
<div class="hhead"><h1>Roadmap</h1></div>
<div class="card howcard" id="stage"></div>
</main>
<script src="data.js?v=e4c4ad2"></script><script src="app.js?v=e4c4ad2"></script><script src="story-shared.js?v=e4c4ad2"></script>
<script>
/* How we build it, in order (PRD section 14, strategy S10, D78, D180). Plain words; no durations on screen (they are placeholders). */
nav("plan.html", "", { demo: true });
document.getElementById("stepper").innerHTML = storyStepper(4);
const STEPS_R = [
  ["Discovery", "Know where we start", ["List every pharmacy document and its owner", "Measure today's wrong answers and handle time", "Agree approvers with Legal; finish security and vendor review"], ["Baseline numbers agreed", "Every document has an owner", "Build, buy or partner decided"]],
  ["Foundation", "Build the core safely", ["Knowledge store and approval workflow", "Sign-in and roles from the company's identity system", "Audit trail and the test harness"], ["Every safety rule passes the tests", "Every action lands in the audit trail"]],
  ["Pilot knowledge base", "Get one knowledge base right", ["Move the Pharmacy content in", "Legal clears the duplicate wordings", "Train authors and approvers"], ["One approved wording per clause", "No wrong merges", "Drift alerts are accurate"]],
  ["Advocate search", "Advocates trust one answer", ["Run beside today's tools first (shadow)", "Compare its answers with today's", "Go live for one team"], ["Nobody sees content outside their role", "Fewer repeat calls than baseline", "Handle time at or below baseline"]],
  ["Agent Assist", "AI helps on live calls", ["Agent Assist reads approved answers only", "Test against today on a share of calls", "Review a sample every week"], ["Claims backed by their source", "Legal's words never changed", "Advocates override it less over time"]],
  ["Members and every channel", "Members get the same answer", ["Member chat to a small group first", "Disclose AI use; stricter member rules", "Then texts, website, more knowledge bases"], ["Same answer on every channel", "Member complaints about wrong answers fall", "Weekly checks stay green"]]
];
/* Which product jobs (Solution architecture and How it works) each phase builds */
const JOBS_P = [[], ["Job 2 Govern", "Job 4 Test"], ["Job 1 Ingest", "Job 2 Govern"], ["Job 3 Serve: advocate search"], ["Job 3 Serve: Agent Assist"], ["Job 3 Serve: member chat, texts, website"]];
/* Which PRD functional requirements each phase delivers (PRD section 6) */
const FR_P = [[], [["FR-1", "Governance store"], ["FR-2", "Approval"], ["FR-3", "Eval runner"]], [["FR-4", "Ingestion"], ["FR-5", "Extraction"], ["FR-6", "Dedup"], ["FR-7", "Drift detection"]], [["FR-8", "Retrieval and answer"], ["FR-9", "Read contract"], ["FR-10", "Gap log"]], [["FR-9", "Read contract for Agent Assist"]], [["FR-11", "Member-channel rules"], ["FR-12", "Outbound and consent"]]];
const EXTRA = [
  ["Content inventory, baseline report, signed approver list", "No reliable baseline for wrong answers: measure it on a sample of recorded calls"],
  ["The platform running in a test environment", "Identity and roles integration slips: start it during discovery"],
  ["The Pharmacy knowledge base, approved end to end", "Legal's review backlog: the AI shows word-by-word differences so each ruling is quick, and late reviews escalate"],
  ["Search live for one advocate team", "Advocates keep their old habits: shadow comparison first, training, and old tools kept until trust is earned"],
  ["Agent Assist answering from approved content", "Confident wrong answers: only cited answers and Legal's exact words, with a weekly human review"],
  ["Member chat and every channel on one source", "Regulatory exposure: AI use disclosed, stricter rules, a small rollout first, and the stop rule"]
];
let shown = 1;
document.getElementById("stage").innerHTML = `<p class="eyebrow">Plan to build the future state</p>
  <h2 class="hl">From prototype to production: six phases, each with an owner and a gate it must pass.</h2>
  <div class="tl"><div class="tl-line"><i id="tlfill"></i></div>${STEPS_R.map((r, i) => `<button class="tl-n" data-n="${i}"><span class="tl-d">${i + 1}</span><span class="tl-t">${esc(r[0])}</span></button>`).join("")}</div>
  <div id="phcard" class="phcard"></div>
  <div class="foot" style="margin-top:16px"><button class="btn" id="php">← Previous</button><span class="small" id="phc"></span><button class="btn primary" id="phn">Next phase →</button></div>`;
let cur = 0;
function card(i) { const r = STEPS_R[i], x = EXTRA[i], j = JOBS_P[i];
  return `<div class="pc-top"><div><small>Phase ${i + 1} of ${STEPS_R.length}</small><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p></div><div class="ph-jobs">${j.length ? j.map(t => `<span>Builds ${esc(t)}</span>`).join("") : `<span class="pre">Before any build</span>`}</div></div>
  <div class="pc-grid"><div class="pc-b"><b>What we do</b><ul>${r[2].map(t => `<li>${esc(t)}</li>`).join("")}</ul></div><div class="pc-b ok"><b>Success looks like</b><ul class="tk">${r[3].map(t => `<li>${esc(t)}</li>`).join("")}</ul></div><div class="pc-b"><b>Delivers</b><p>${esc(x[0])}</p></div><div class="pc-b risk"><b>Biggest risk, and how we handle it</b><p>${esc(x[1])}</p></div></div>${FR_P[i].length ? `<div class="pc-fr"><b>Requirements it delivers</b>${FR_P[i].map(([id, n]) => `<a href="prd.html#fr">${esc(id)} ${esc(n)}</a>`).join("")}<span>See how each is built and accepted in the PRD →</span></div>` : `<div class="pc-fr"><b>Requirements it delivers</b><span>None yet: discovery confirms them before any build</span></div>`}`; }
function go(i) { cur = Math.max(0, Math.min(STEPS_R.length - 1, i)); const c = document.getElementById("phcard"); c.classList.remove("in"); void c.offsetWidth; c.innerHTML = card(cur); c.classList.add("in");
  document.querySelectorAll(".tl-n").forEach((b, k) => { b.classList.toggle("on", k === cur); b.classList.toggle("done", k < cur); });
  document.getElementById("tlfill").style.width = (cur / (STEPS_R.length - 1) * 100) + "%";
  document.getElementById("phc").textContent = `Phase ${cur + 1} of ${STEPS_R.length} · use ← →`;
  document.getElementById("php").style.visibility = cur ? "visible" : "hidden";
  const n = document.getElementById("phn"); n.textContent = cur < STEPS_R.length - 1 ? "Next phase →" : "Next: Trade-offs →"; n.onclick = () => cur < STEPS_R.length - 1 ? go(cur + 1) : (location.href = "choices.html"); }
document.querySelectorAll(".tl-n").forEach(b => b.onclick = () => go(+b.dataset.n));
document.getElementById("php").onclick = () => go(cur - 1);
go(0);
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { go(cur + 1); e.preventDefault(); } if (e.key === "ArrowLeft") { go(cur - 1); e.preventDefault(); } });
document.querySelector("main").insertAdjacentHTML("beforeend", `<p class="small" style="margin-top:14px">Phase gates and order from the PRD, section 14. Discovery, shadow mode and change management are our recommended delivery practice. Timings are left out until discovery sizes them.</p>`);
</script></body></html>
